<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Tpig - Lịch Sử Cược</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        mono: ['"IBM Plex Mono"', 'monospace'],
                    },
                    colors: { brand: '#00E5FF', brandDark: '#0077FF' },
                    animation: { 'blob': 'blob 7s infinite', 'fade-in': 'fadeIn 0.5s ease-out' },
                    keyframes: {
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' },
                        },
                        fadeIn: { '0%': { opacity: '0', transform: 'translateY(10px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } }
                    }
                }
            }
        }
    </script>

    <style>
        /* CSS CORE & NGĂN CHẶN ZOOM/CUỘN THỪA */
        html, body { 
            touch-action: pan-y; overscroll-behavior-y: none; height: 100%; overflow: hidden; 
            background-color: #030712; -webkit-text-size-adjust: 100%; color: #f3f4f6;
        }
        body { display: flex; flex-direction: column; }
        a, button, input { touch-action: manipulation; outline: none; -webkit-tap-highlight-color: transparent;}
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }

        /* AURORA BACKGROUND EFFECT (Đồng bộ với trang Nhiệm vụ) */
        .ambient-bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
        .orb { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.4; animation: blob 10s infinite alternate; }
        .orb-1 { top: -10%; left: -10%; width: 50vw; height: 50vw; background: rgba(0, 229, 255, 0.25); animation-delay: 0s; }
        .orb-2 { bottom: 10%; right: -10%; width: 60vw; height: 60vw; background: rgba(111, 0, 255, 0.2); animation-delay: 2s; }
        .orb-3 { top: 30%; left: 20%; width: 40vw; height: 40vw; background: rgba(0, 119, 255, 0.15); animation-delay: 4s; }

        /* GLASS PANELS */
        .glass-panel {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.04) 0%, rgba(255, 255, 255, 0.01) 100%);
            backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
            border-radius: 20px; overflow: hidden; position: relative;
        }

        /* MÀU SẮC LỊCH SỬ */
        .text-up { color: #34d399; } /* Emerald-400 */
        .text-down { color: #fb7185; } /* Rose-400 */
        .text-tie { color: #fbbf24; } /* Amber-400 */
        .text-player { color: #60a5fa; } /* Blue-400 */
        .text-banker { color: #fb7185; } /* Rose-400 */

        /* BOTTOM NAV */
        .bottom-nav { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border-top: 1px solid rgba(255,255,255,0.08); padding-bottom: env(safe-area-inset-bottom, 10px); }
        .nav-item { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); text-decoration: none; cursor: pointer; color: #64748b; }
        .nav-item.active { color: #00E5FF; text-shadow: 0 0 10px rgba(0,229,255,0.5); }
        .nav-item.active i { transform: translateY(-4px) scale(1.1); }
        .nav-item:not(.active):active { transform: scale(0.9); opacity: 0.7; }

        /* LOADING SPINNER */
        .loading-spinner {
            border: 3px solid rgba(255,255,255,0.1); border-radius: 50%;
            border-top: 3px solid #00E5FF; width: 32px; height: 32px;
            animation: spin 1s linear infinite; margin: 40px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* CHI TIẾT EXPAND/COLLAPSE ACCORDION */
        .details-content { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .details-content.open { grid-template-rows: 1fr; }
        .details-inner { overflow: hidden; }
    </style>
</head>
<body>

    <!-- BACKGROUND -->
    <div class="ambient-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <!-- HEADER BAR ĐỒNG BỘ -->
    <header class="flex items-center justify-between px-4 h-[68px] glass-panel rounded-none border-t-0 border-l-0 border-r-0 border-b border-white/[0.08] z-30 shrink-0 sticky top-0 bg-opacity-40">
        <div class="flex items-center gap-3">
            <a href="cskh.html" class="bg-white/5 border border-white/10 px-3 py-2 rounded-xl flex items-center gap-2 active:scale-90 transition-all shadow-sm hover:bg-white/10">
                <i class="fa-solid fa-headset text-[#00E5FF] drop-shadow-[0_0_5px_rgba(0,229,255,0.5)]"></i>
                <span class="text-xs font-bold text-gray-200">CSKH</span>
            </a>
            <div class="font-extrabold text-2xl tracking-tight flex items-center gap-1 ml-1 drop-shadow-[0_0_10px_rgba(0,229,255,0.3)]">
                <span class="text-transparent bg-clip-text bg-gradient-to-br from-[#00E5FF] to-[#0077FF]">T</span>PIG
            </div>
        </div>

        <a href="taikhoan.html" class="bg-slate-900/60 pl-3 pr-1 py-1.5 rounded-2xl border border-white/10 flex items-center gap-2 shadow-[inset_0_2px_4px_rgba(0,0,0,0.5)] transition-all active:scale-95 hover:bg-white/5">
            <div class="flex flex-col items-end leading-none">
                <span class="text-[9px] text-[#64748b] font-bold uppercase mb-1 tracking-widest">SỐ DƯ</span>
                <span id="balanceDisplayHeader" class="text-white font-mono text-sm font-bold tracking-tight animate-pulse">...</span>
            </div>
            <div class="w-8 h-8 bg-gradient-to-br from-[#00E5FF] to-[#0077FF] rounded-xl flex items-center justify-center text-[14px] font-black text-white shadow-[0_4px_10px_rgba(0,119,255,0.4)] border border-white/20">
                T
            </div>
        </a>
    </header>

    <!-- MAIN CONTENT -->
    <main class="flex-1 overflow-y-auto hide-scroll pb-28 relative flex flex-col z-10 w-full max-w-[600px] mx-auto">
        <!-- THỐNG KÊ LỢI NHUẬN RÒNG ĐỒNG BỘ UI -->
        <div class="p-4 pb-2 shrink-0 z-10 relative">
            <div class="glass-panel p-5 flex justify-between items-center relative overflow-hidden group">
                <div class="absolute -right-10 -top-10 w-32 h-32 bg-[#00E5FF] opacity-[0.1] rounded-full blur-3xl pointer-events-none group-hover:opacity-20 transition-opacity"></div>
                <div class="absolute -left-6 -bottom-6 w-24 h-24 bg-[#0077FF] opacity-[0.1] rounded-full blur-2xl pointer-events-none"></div>
                
                <div class="flex flex-col z-10">
                    <span class="text-[10px] text-gray-400 font-bold uppercase tracking-widest mb-1.5">Lợi nhuận (7 Ngày)</span>
                    <div class="flex items-baseline gap-1.5">
                        <span class="font-mono font-black text-[28px] tracking-tight drop-shadow-md" id="netProfitDisplay">0.00</span>
                        <span class="text-[#00E5FF] font-black text-sm drop-shadow-sm">T</span>
                    </div>
                </div>
                
                <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-[#00E5FF]/10 to-[#0077FF]/10 border border-[#00E5FF]/20 flex items-center justify-center shadow-[inset_0_0_15px_rgba(0,229,255,0.1)] z-10">
                    <i class="fa-solid fa-chart-pie text-[#00E5FF] text-2xl drop-shadow-[0_0_8px_rgba(0,229,255,0.5)]"></i>
                </div>
            </div>
        </div>

        <!-- LIST CONTAINER -->
        <div class="flex-1 px-4 py-2 relative z-10 space-y-3.5" id="historyList">
            <div class="loading-spinner" id="mainSpinner"></div>
        </div>
    </main>

    <!-- BOTTOM NAV ĐỒNG BỘ -->
    <div class="bottom-nav fixed bottom-0 left-0 right-0 h-[76px] flex items-center justify-around px-2 z-40 shadow-[0_-10px_30px_rgba(0,0,0,0.8)]">
        <a href="game.html" class="nav-item flex flex-col items-center justify-center w-[70px] h-full gap-1.5">
            <i class="fa-solid fa-gamepad text-[22px]"></i>
            <span class="text-[10px] font-bold tracking-wide">Trò chơi</span>
        </a>
        <a href="nhiemvu.html" class="nav-item flex flex-col items-center justify-center w-[70px] h-full gap-1.5">
            <i class="fa-solid fa-list-check text-[22px]"></i>
            <span class="text-[10px] font-bold tracking-wide">Nhiệm vụ</span>
        </a>
        <a href="naprut.html" class="relative -top-7 flex flex-col items-center justify-center w-[70px] group">
            <div class="absolute inset-0 bg-[#00E5FF] rounded-full blur-lg opacity-40 group-active:opacity-60 transition-opacity"></div>
            <div class="w-[64px] h-[64px] bg-gradient-to-br from-[#00E5FF] to-[#0077FF] rounded-full flex items-center justify-center shadow-[0_5px_20px_rgba(0,119,255,0.5)] border-[6px] border-[#030712] group-active:scale-95 transition-transform z-10 relative">
                <i class="fa-solid fa-wallet text-2xl text-white drop-shadow-sm"></i>
            </div>
            <span class="text-[10px] font-extrabold text-[#00E5FF] mt-1.5 tracking-wide drop-shadow-md">Giao Dịch</span>
        </a>
        <a href="lichsu.html" class="nav-item active flex flex-col items-center justify-center w-[70px] h-full gap-1.5">
            <i class="fa-solid fa-clock-rotate-left text-[22px]"></i>
            <span class="text-[10px] font-bold tracking-wide">Lịch sử</span>
        </a>
        <a href="taikhoan.html" class="nav-item flex flex-col items-center justify-center w-[70px] h-full gap-1.5">
            <i class="fa-solid fa-user text-[22px]"></i>
            <span class="text-[10px] font-bold tracking-wide">Tài khoản</span>
        </a>
    </div>

    <!-- FIREBASE & LOGIC SCRIPT -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, collection, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // CẤM ZOOM
        document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
        document.addEventListener('dblclick', function(e) { e.preventDefault(); });

        // TIỆN ÍCH FORMAT TIỀN
        const formatMoney = (val) => Number(val || 0).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});

        // CONFIG FIREBASE
        const app = initializeApp({
            apiKey: "AIzaSyAyYO8ZhxVvOImOZveUJULkK8tdcSxo7pU",
            authDomain: "btccoinbig.firebaseapp.com",
            projectId: "btccoinbig",
            storageBucket: "btccoinbig.firebasestorage.app",
            messagingSenderId: "116892525933",
            appId: "1:116892525933:web:04b0da25f3f933ce162664"
        });

        const auth = getAuth(app);
        const db = getFirestore(app);
        
        let currentUID = null;

        // --- MỞ RỘNG CHI TIẾT ---
        window.toggleDetails = function(id) {
            const content = document.getElementById(`detail-${id}`);
            const icon = document.getElementById(`icon-${id}`);
            if (content.classList.contains('open')) {
                content.classList.remove('open');
                icon.style.transform = 'rotate(0deg)';
            } else {
                content.classList.add('open');
                icon.style.transform = 'rotate(180deg)';
            }
        };

        // --- AUTH & LOAD DỮ LIỆU CHUNG ---
        onAuthStateChanged(auth, (user) => {
            if (user && !user.isAnonymous) {
                currentUID = user.uid;
                
                // Đồng bộ số dư góc trên
                onSnapshot(doc(db, "users", user.uid), (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        const balDisplay = document.getElementById('balanceDisplayHeader');
                        balDisplay.innerText = formatMoney(data.balance);
                        balDisplay.classList.remove('animate-pulse');
                    }
                });

                loadHistory(user.uid);
            } else {
                // FALLBACK NẾU CHƯA ĐĂNG NHẬP
                let userStr = localStorage.getItem('crownex_user_info');
                if (userStr) {
                    const data = JSON.parse(userStr);
                    const balDisplay = document.getElementById('balanceDisplayHeader');
                    balDisplay.innerText = formatMoney(data.balance);
                    balDisplay.classList.remove('animate-pulse');
                }
            }
        });

        // --- HÀM TẢI LỊCH SỬ (7 NGÀY) ---
        async function loadHistory(uid) {
            const listEl = document.getElementById('historyList');
            const netEl = document.getElementById('netProfitDisplay');
            let allHistory = [];
            
            // Tính mốc thời gian 7 ngày
            const now = new Date();
            const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
            const yesterdayStart = todayStart - 86400000;
            const sevenDaysAgoStart = todayStart - (6 * 86400000); // Hôm nay + 6 ngày trước = 7 ngày
            
            try {
                // Fetch 100 record mới nhất từ các sảnh
                const qCripto = query(collection(db, "users", uid, "betHistory"), orderBy("timestamp", "desc"), limit(100));
                const snapCripto = await getDocs(qCripto);
                snapCripto.forEach(doc => allHistory.push({ id: doc.id, sdtType: 'cripto', ...doc.data() }));

                const qCasino = query(collection(db, "users", uid, "baccaratHistory"), orderBy("timestamp", "desc"), limit(100));
                const snapCasino = await getDocs(qCasino);
                snapCasino.forEach(doc => allHistory.push({ id: doc.id, sdtType: 'casino', ...doc.data() }));

                // Tiền xử lý: Lọc các giao dịch trong 7 ngày và chuẩn hóa timestamp
                let validHistory = [];
                allHistory.forEach(data => {
                    let ts = Date.now();
                    if (data.timestamp) {
                        if (typeof data.timestamp.toMillis === 'function') ts = data.timestamp.toMillis();
                        else if (data.timestamp.seconds) ts = data.timestamp.seconds * 1000;
                        else if (typeof data.timestamp === 'number') ts = data.timestamp;
                    }

                    // Chỉ lấy dữ liệu trong phạm vi 7 ngày
                    if (ts >= sevenDaysAgoStart) {
                        data._ts = ts; 
                        validHistory.push(data);
                    }
                });

                if (validHistory.length === 0) {
                    showEmptyState(listEl, netEl, "Chưa có giao dịch nào");
                    return;
                }

                // Sắp xếp mảng gộp theo thời gian giảm dần và chỉ lấy 50 giao dịch
                validHistory.sort((a, b) => b._ts - a._ts);
                validHistory = validHistory.slice(0, 50);

                let html = '';
                let netProfit = 0;

                validHistory.forEach(data => {
                    const ts = data._ts;
                    const amount = parseFloat(data.amount) || 0;
                    
                    // --- FORMAT HIỂN THỊ THỜI GIAN THÔNG MINH ---
                    let dateLabel = "";
                    const date = new Date(ts);
                    const timeStr = `${('0'+date.getHours()).slice(-2)}:${('0'+date.getMinutes()).slice(-2)}`;
                    
                    if (ts >= todayStart) {
                        dateLabel = `Hôm nay • ${timeStr}`;
                    } else if (ts >= yesterdayStart) {
                        dateLabel = `Hôm qua • ${timeStr}`;
                    } else {
                        dateLabel = `${('0'+date.getDate()).slice(-2)}/${('0'+(date.getMonth()+1)).slice(-2)} • ${timeStr}`;
                    }
                    
                    // --- TÍNH LỢI NHUẬN & RENDER HTML ---
                    if (data.sdtType === 'cripto') {
                        const isWin = data.result === 'win';
                        const profit = parseFloat(data.profit) || 0;
                        if(isWin) netProfit += profit; else netProfit -= amount;
                        html += renderCriptoItem(data, dateLabel, isWin, profit, amount, data.id);
                    } else if (data.sdtType === 'casino') {
                        const winAmount = parseFloat(data.winAmount || 0); 
                        const profit = winAmount - amount; 
                        netProfit += profit;
                        html += renderCasinoItem(data, dateLabel, profit, amount, data.id);
                    }
                });

                listEl.innerHTML = html;
                updateNetProfitDisplay(netEl, netProfit);

            } catch (error) {
                console.error(error);
                showEmptyState(listEl, netEl, "Lỗi tải dữ liệu. Vui lòng thử lại.");
            }
        }

        // --- RENDER HTML CHO CRIPTO (ÁP DỤNG GLASS-PANEL UI) ---
        function renderCriptoItem(data, dateLabel, isWin, profit, amount, id) {
            const shortId = id.substring(0,8).toUpperCase();
            const trendIcon = data.type === 'up' ? 'fa-arrow-trend-up' : 'fa-arrow-trend-down';
            const typeLabel = data.type === 'up' ? 'MUA LÊN' : 'BÁN XUỐNG';
            const typeColor = data.type === 'up' ? 'text-up' : 'text-down';
            const bgIconColor = data.type === 'up' ? 'bg-emerald-500/10 border-emerald-500/20' : 'bg-rose-500/10 border-rose-500/20';

            return `
                <div class="glass-panel p-4 overflow-hidden group">
                    <div class="flex justify-between items-center relative z-10">
                        <div class="flex items-center gap-3.5">
                            <div class="w-12 h-12 rounded-xl flex items-center justify-center border shadow-inner shrink-0 ${bgIconColor}">
                                <i class="fa-brands fa-bitcoin text-xl ${typeColor} drop-shadow-sm"></i>
                            </div>
                            <div>
                                <div class="font-bold text-[14px] text-gray-100 uppercase tracking-wide mb-1">Cripto Trade</div>
                                <div class="text-[10px] text-gray-500 font-mono tracking-widest">${dateLabel}</div>
                            </div>
                        </div>
                        <div class="text-right flex flex-col items-end">
                            <div class="font-mono font-black text-base ${isWin ? 'text-up' : 'text-down'} tracking-tight mb-1.5 drop-shadow-sm">
                                ${isWin ? '+' : '-'}${isWin ? formatMoney(profit) : formatMoney(amount)} T
                            </div>
                            <span class="text-[9px] ${isWin ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' : 'bg-rose-500/10 text-rose-400 border-rose-500/20'} px-2 py-0.5 rounded font-bold tracking-widest border">
                                ${isWin ? 'THẮNG' : 'THUA'}
                            </span>
                        </div>
                    </div>
                    
                    <div class="mt-3.5 pt-3 border-t border-white/5 flex justify-between items-center relative z-10">
                        <div class="text-[10px] text-gray-400 font-bold uppercase tracking-widest flex items-center gap-1.5">
                            Cược: <span class="text-white font-mono">${formatMoney(amount)} T</span>
                        </div>
                        <button class="text-[10px] bg-white/5 hover:bg-white/10 text-[#00E5FF] px-3.5 py-1.5 rounded-lg border border-white/10 transition-colors flex items-center gap-1.5 font-bold tracking-wider" onclick="window.toggleDetails('${id}')">
                            Chi tiết <i class="fa-solid fa-chevron-down transition-transform duration-300" id="icon-${id}"></i>
                        </button>
                    </div>

                    <div class="details-content relative z-10" id="detail-${id}">
                        <div class="details-inner">
                            <div class="pt-3 mt-3 border-t border-white/5 space-y-2.5">
                                <div class="flex justify-between items-center text-[11px]">
                                    <span class="text-gray-500 font-bold uppercase tracking-wider">Mã Giao Dịch:</span>
                                    <span class="font-mono text-gray-300 bg-black/40 px-2.5 py-1 rounded-md border border-white/5 shadow-inner">#${shortId}</span>
                                </div>
                                <div class="flex justify-between items-center text-[11px]">
                                    <span class="text-gray-500 font-bold uppercase tracking-wider">Dự đoán:</span>
                                    <span class="font-bold ${typeColor} flex items-center gap-1.5 uppercase tracking-widest bg-black/20 px-2.5 py-1 rounded-md border border-white/5">
                                        <i class="fa-solid ${trendIcon}"></i> ${typeLabel}
                                    </span>
                                </div>
                                <div class="flex justify-between items-center text-[11px]">
                                    <span class="text-gray-500 font-bold uppercase tracking-wider">Kết quả:</span>
                                    <span class="font-bold ${isWin ? 'text-up' : 'text-down'} tracking-widest uppercase">
                                        ${isWin ? 'Chính xác' : 'Sai lệch'}
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>`;
        }

        // --- RENDER HTML CHO CASINO (BACCARAT) ---
        function renderCasinoItem(data, dateLabel, profit, amount, id) {
            const shortId = id.substring(0,8).toUpperCase();
            let resultClass = 'text-down'; let resultSign = '-'; let resultText = 'Thua'; let badgeColor = 'bg-rose-500/10 text-rose-400 border-rose-500/20';
            
            if (profit > 0) { resultClass = 'text-up'; resultSign = '+'; resultText = 'Thắng'; badgeColor = 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20'; }
            else if (profit === 0) { resultClass = 'text-tie'; resultSign = ''; resultText = 'Hòa'; badgeColor = 'bg-amber-500/10 text-amber-400 border-amber-500/20'; }
            
            const bet = data.betChoice || data.bet || '?';
            let betDisplay = "???"; let betColor = "text-gray-400";
            if (bet === 'P') { betDisplay = "CON (PLAYER)"; betColor = "text-player"; }
            else if (bet === 'B') { betDisplay = "CÁI (BANKER)"; betColor = "text-banker"; }
            else if (bet === 'T') { betDisplay = "HÒA (TIE)"; betColor = "text-tie"; }

            const winner = data.winner || data.result || '?';
            let winDisplay = "???"; let winColor = "text-gray-500";
            if (winner === 'P') { winDisplay = "CON (PLAYER)"; winColor = "text-player"; }
            else if (winner === 'B') { winDisplay = "CÁI (BANKER)"; winColor = "text-banker"; }
            else if (winner === 'T') { winDisplay = "HÒA (TIE)"; winColor = "text-tie"; }

            return `
                <div class="glass-panel p-4 overflow-hidden group">
                    <div class="flex justify-between items-center relative z-10">
                        <div class="flex items-center gap-3.5">
                            <div class="w-12 h-12 rounded-xl flex items-center justify-center border shadow-inner shrink-0 bg-[#00E5FF]/10 border-[#00E5FF]/20">
                                <i class="fa-solid fa-dharmachakra text-xl text-[#00E5FF] drop-shadow-sm"></i>
                            </div>
                            <div>
                                <div class="font-bold text-[14px] text-gray-100 uppercase tracking-wide mb-1">Baccarat</div>
                                <div class="text-[10px] text-gray-500 font-mono tracking-widest">${dateLabel}</div>
                            </div>
                        </div>
                        <div class="text-right flex flex-col items-end">
                            <div class="font-mono font-black text-base ${resultClass} tracking-tight mb-1.5 drop-shadow-sm">
                                ${resultSign}${formatMoney(Math.abs(profit))} T
                            </div>
                            <span class="text-[9px] ${badgeColor} px-2 py-0.5 rounded font-bold tracking-widest border uppercase">
                                ${resultText}
                            </span>
                        </div>
                    </div>
                    
                    <div class="mt-3.5 pt-3 border-t border-white/5 flex justify-between items-center relative z-10">
                        <div class="text-[10px] text-gray-400 font-bold uppercase tracking-widest flex items-center gap-1.5">
                            Cược: <span class="text-white font-mono">${formatMoney(amount)} T</span>
                        </div>
                        <button class="text-[10px] bg-white/5 hover:bg-white/10 text-[#00E5FF] px-3.5 py-1.5 rounded-lg border border-white/10 transition-colors flex items-center gap-1.5 font-bold tracking-wider" onclick="window.toggleDetails('${id}')">
                            Chi tiết <i class="fa-solid fa-chevron-down transition-transform duration-300" id="icon-${id}"></i>
                        </button>
                    </div>

                    <div class="details-content relative z-10" id="detail-${id}">
                        <div class="details-inner">
                            <div class="pt-3 mt-3 border-t border-white/5 space-y-2.5">
                                <div class="flex justify-between items-center text-[11px]">
                                    <span class="text-gray-500 font-bold uppercase tracking-wider">Mã Giao Dịch:</span>
                                    <span class="font-mono text-gray-300 bg-black/40 px-2.5 py-1 rounded-md border border-white/5 shadow-inner">#${shortId}</span>
                                </div>
                                <div class="flex justify-between items-center text-[11px]">
                                    <span class="text-gray-500 font-bold uppercase tracking-wider">Cửa đặt:</span>
                                    <span class="font-bold ${betColor} uppercase tracking-widest bg-black/20 px-2.5 py-1 rounded-md border border-white/5">
                                        ${betDisplay}
                                    </span>
                                </div>
                                <div class="flex justify-between items-center text-[11px]">
                                    <span class="text-gray-500 font-bold uppercase tracking-wider">Kết quả:</span>
                                    <span class="font-bold ${winColor} uppercase tracking-widest">
                                        Ván về ${winDisplay}
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>`;
        }

        // --- HELPERS HIỂN THỊ ---
        function showEmptyState(listEl, netEl, msg) {
            netEl.innerText = "0.00";
            netEl.className = "font-mono font-black text-[28px] tracking-tight text-white drop-shadow-md";
            listEl.innerHTML = `
                <div class="flex flex-col items-center justify-center py-16 glass-panel border border-dashed border-white/10 opacity-70">
                    <i class="fa-solid fa-box-open text-5xl mb-4 text-gray-600 drop-shadow-md"></i>
                    <span class="text-[11px] text-gray-400 font-bold uppercase tracking-widest">${msg}</span>
                </div>`;
        }

        function updateNetProfitDisplay(netEl, netProfit) {
            const sign = netProfit > 0 ? "+" : "";
            netEl.innerText = sign + formatMoney(netProfit);
            if(netProfit > 0) netEl.className = "font-mono font-black text-[28px] tracking-tight text-up drop-shadow-md";
            else if (netProfit < 0) netEl.className = "font-mono font-black text-[28px] tracking-tight text-down drop-shadow-md";
            else netEl.className = "font-mono font-black text-[28px] tracking-tight text-white drop-shadow-md";
        }
    </script>
</body>
</html>
