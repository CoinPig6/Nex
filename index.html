<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <!-- CHẶN ZOOM TUYỆT ĐỐI TRÊN MOBILE -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Tpig - Cổng Đăng Nhập</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Roboto', 'sans-serif'],
                        mono: ['IBM Plex Mono', 'monospace'],
                    },
                    colors: { brand: '#FCD535' },
                    animation: {
                        'slide-up': 'slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                    },
                    keyframes: {
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(30px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* --- CẤU HÌNH CỐT LÕI --- */
        html, body {
            min-height: 100dvh; 
            overflow-x: hidden; 
            overflow-y: auto; 
            touch-action: pan-y; 
            -webkit-text-size-adjust: 100%;
            background-color: #050507; /* Dark Premium */
            scroll-behavior: smooth;
            background-image: radial-gradient(circle at 50% 0%, rgba(30, 41, 59, 0.6) 0%, transparent 80%);
        }
        
        /* BẮT BUỘC FONT-SIZE 16PX CHO INPUT ĐỂ CHỐNG ZOOM TRÊN IOS */
        input, select, textarea { font-size: 16px !important; appearance: none; -webkit-appearance: none; border-radius: 0; }
        button, a { touch-action: manipulation; outline: none; -webkit-tap-highlight-color: transparent; }

        /* CARD STYLE - KÍNH MỜ */
        .glass-panel {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.03) 0%, rgba(255, 255, 255, 0.01) 100%);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 30px 60px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05);
            border-radius: 28px;
            width: 100%; max-width: 380px;
            position: relative; overflow: hidden;
            transition: height 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* INPUT STYLE - DỄ NHÌN HƠN */
        .input-box { position: relative; margin-bottom: 16px; }
        .input-control {
            width: 100%; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1);
            color: #fff; padding: 15px 16px 15px 48px; border-radius: 16px;
            transition: all 0.3s ease;
        }
        .input-control:focus {
            border-color: #FCD535; background: rgba(255,255,255,0.02); outline: none; box-shadow: 0 0 0 1px rgba(252,213,53,0.5), inset 0 2px 5px rgba(0,0,0,0.5);
        }
        .input-control::placeholder { color: #6b7280; font-size: 15px; }
        
        .input-icon {
            position: absolute; left: 18px; top: 50%; transform: translateY(-50%);
            color: #6b7280; font-size: 18px; transition: 0.3s;
        }
        .input-control:focus ~ .input-icon { color: #FCD535; drop-shadow: 0 0 5px rgba(252,213,53,0.5); }

        /* SMOOTH TABS */
        .tab-wrapper {
            display: flex; position: relative; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.05);
            border-radius: 16px; padding: 5px; margin-bottom: 28px; box-shadow: inset 0 2px 5px rgba(0,0,0,0.3);
        }
        .tab-item {
            flex: 1; text-align: center; padding: 12px; font-size: 14px; font-weight: 800;
            color: #9ca3af; cursor: pointer; z-index: 10; transition: color 0.3s; letter-spacing: 0.5px;
        }
        .tab-item.active { color: #111; }
        
        /* Sliding Pill Indicator */
        .tab-indicator {
            position: absolute; top: 5px; left: 5px; bottom: 5px; width: calc(50% - 5px);
            background: linear-gradient(135deg, #FCD535 0%, #f59e0b 100%); border-radius: 12px; transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            box-shadow: 0 4px 15px rgba(252, 213, 53, 0.3); z-index: 1;
        }

        /* BUTTON */
        .btn-action {
            width: 100%; background: linear-gradient(135deg, #FCD535 0%, #d97706 100%);
            color: #111; font-weight: 900; padding: 16px; border-radius: 16px;
            font-size: 15px; text-transform: uppercase; margin-top: 10px; letter-spacing: 1px;
            box-shadow: 0 8px 25px rgba(252, 213, 53, 0.3); transition: all 0.2s; border: none;
        }
        .btn-action:active:not(:disabled) { transform: scale(0.96); box-shadow: 0 4px 10px rgba(252, 213, 53, 0.2); }
        .btn-action:disabled { opacity: 0.7; cursor: not-allowed; filter: grayscale(50%); transform: none; box-shadow: none; }

        /* FORM SLIDING ANIMATION */
        .forms-container {
            position: relative;
            height: 295px; /* Chiều cao Đăng nhập */
            overflow: hidden;
            transition: height 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .auth-form {
            position: absolute; top: 0; left: 0; width: 100%;
            transition: all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
            opacity: 0; transform: translateX(40px); pointer-events: none;
        }

        .auth-form.active {
            opacity: 1; transform: translateX(0); pointer-events: auto; z-index: 20;
        }
        
        .auth-form.slide-left { transform: translateX(-40px); opacity: 0; }
        .auth-form.slide-right { transform: translateX(40px); opacity: 0; }

        /* TOAST - iOS STYLE */
        #toast-box {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            z-index: 9999; width: max-content; max-width: 90vw; pointer-events: none;
        }
        .toast-msg {
            background: rgba(20, 24, 34, 0.95); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 12px 18px; border-radius: 100px; display: flex; align-items: center; gap: 12px;
            margin-bottom: 10px; box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            animation: slideDown 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; pointer-events: auto;
        }
        @keyframes slideDown { from { opacity:0; transform:translateY(-40px); } to { opacity:1; transform:translateY(0); } }

        /* Canvas Captcha */
        .captcha-box {
            background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 14px; overflow: hidden; cursor: pointer; position: relative;
        }
        .captcha-box::after {
            content: '\f021'; font-family: 'Font Awesome 6 Free'; font-weight: 900;
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.6); color: white; opacity: 0; transition: 0.2s; font-size: 20px;
        }
        .captcha-box:hover::after { opacity: 1; }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-[100dvh] relative">

    <div id="toast-box"></div>

    <!-- MAIN APP WRAPPER (ẨN MẶC ĐỊNH ĐỂ LOAD NGẦM) -->
    <div id="appWrapper" class="opacity-0 transition-opacity duration-700 p-4 w-full flex flex-col items-center justify-center relative z-10 w-full max-w-[420px]">
        
        <div class="glass-panel p-7 w-full animate-slide-up">
            
            <!-- HEADER / LOGO -->
            <div class="text-center mb-8">
                <div class="font-black text-[38px] text-white tracking-widest italic flex items-center justify-center gap-1 mb-1 drop-shadow-[0_0_15px_rgba(252,213,53,0.3)]">
                    <span class="text-transparent bg-clip-text bg-gradient-to-r from-[#FCD535] to-[#f59e0b]">T</span>PIG
                </div>
                <h1 class="text-[11px] font-bold text-gray-500 tracking-[0.3em] uppercase">Bùng Nổ Từng Khoảng Khắc Thăng Hoa</h1>
            </div>

            <!-- TABS -->
            <div class="tab-wrapper">
                <div class="tab-indicator" id="tabIndicator"></div>
                <div class="tab-item active" id="tabLoginBtn" onclick="window.switchTab('login')">ĐĂNG NHẬP</div>
                <div class="tab-item" id="tabRegBtn" onclick="window.switchTab('register')">ĐĂNG KÝ</div>
            </div>

            <!-- FORMS CONTAINER -->
            <div class="forms-container" id="formsWrapper">
                
                <!-- LOGIN FORM -->
                <form id="formLogin" class="auth-form active">
                    <div class="input-box">
                        <input type="text" id="loginUser" class="input-control" placeholder="Tên đăng nhập" required autocomplete="off" autocorrect="off" spellcheck="false">
                        <i class="fa-regular fa-user input-icon"></i>
                    </div>
                    <div class="input-box">
                        <input type="password" id="loginPass" class="input-control" placeholder="Mật khẩu" required>
                        <i class="fa-solid fa-lock input-icon"></i>
                        <div class="absolute right-4 top-1/2 -translate-y-1/2 w-8 h-8 flex items-center justify-center cursor-pointer hover:bg-white/5 rounded-full transition" onclick="window.togglePass('loginPass', this)">
                            <i class="fa-regular fa-eye text-gray-400"></i>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-5 gap-3 mb-6">
                        <div class="col-span-3 relative">
                            <input type="text" id="loginCaptcha" class="input-control font-mono uppercase tracking-[0.2em] text-center" placeholder="MÃ XÁC NHẬN" required maxlength="4" style="padding-left:16px;">
                        </div>
                        <div class="col-span-2 captcha-box" onclick="window.drawCaptcha('login')">
                            <canvas id="canvasLogin" width="120" height="52" class="w-full h-full opacity-90"></canvas>
                        </div>
                    </div>

                    <button type="submit" id="btnLogin" class="btn-action">
                        TRUY CẬP HỆ THỐNG
                    </button>
                </form>

                <!-- REGISTER FORM -->
                <form id="formRegister" class="auth-form slide-right">
                    <div class="input-box">
                        <input type="text" id="regUser" class="input-control" placeholder="Tên đăng nhập (viết liền)" required autocomplete="off" autocorrect="off" spellcheck="false">
                        <i class="fa-solid fa-user-tag input-icon"></i>
                    </div>
                    <div class="input-box">
                        <input type="tel" id="regPhone" class="input-control" placeholder="Số điện thoại" required pattern="[0-9]*" inputmode="numeric">
                        <i class="fa-solid fa-phone input-icon"></i>
                    </div>
                    <div class="input-box">
                        <input type="password" id="regPass" class="input-control" placeholder="Mật khẩu (Tối thiểu 6 ký tự)" required minlength="6">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <div class="absolute right-4 top-1/2 -translate-y-1/2 w-8 h-8 flex items-center justify-center cursor-pointer hover:bg-white/5 rounded-full transition" onclick="window.togglePass('regPass', this)">
                            <i class="fa-regular fa-eye text-gray-400"></i>
                        </div>
                    </div>
                    <div class="input-box">
                        <input type="text" id="regName" class="input-control" placeholder="Họ và tên hiển thị" required autocomplete="off">
                        <i class="fa-regular fa-id-card input-icon"></i>
                    </div>

                    <div class="grid grid-cols-5 gap-3 mb-6">
                        <div class="col-span-3 relative">
                            <input type="text" id="regCaptcha" class="input-control font-mono uppercase tracking-[0.2em] text-center" placeholder="MÃ XÁC NHẬN" required maxlength="4" style="padding-left:16px;">
                        </div>
                        <div class="col-span-2 captcha-box" onclick="window.drawCaptcha('reg')">
                            <canvas id="canvasReg" width="120" height="52" class="w-full h-full opacity-90"></canvas>
                        </div>
                    </div>

                    <button type="submit" id="btnReg" class="btn-action">
                        MỞ TÀI KHOẢN NGAY
                    </button>
                </form>

            </div>
        </div>

        <!-- TRUST BADGES (Bổ sung uy tín) -->
        <div class="mt-8 flex items-center justify-center gap-5 w-full opacity-70">
            <div class="flex flex-col items-center gap-1.5">
                <div class="w-10 h-10 rounded-full bg-white/5 border border-white/10 flex items-center justify-center"><i class="fa-solid fa-shield-halved text-emerald-400 text-lg"></i></div>
                <span class="text-[9px] font-bold text-gray-400 tracking-widest uppercase">Bảo Mật SSL</span>
            </div>
            <div class="w-px h-8 bg-white/10"></div>
            <div class="flex flex-col items-center gap-1.5">
                <div class="w-10 h-10 rounded-full bg-white/5 border border-white/10 flex items-center justify-center"><i class="fa-solid fa-bolt text-[#FCD535] text-lg"></i></div>
                <span class="text-[9px] font-bold text-gray-400 tracking-widest uppercase">Rút Tốc Độ</span>
            </div>
            <div class="w-px h-8 bg-white/10"></div>
            <div class="flex flex-col items-center gap-1.5">
                <div class="w-10 h-10 rounded-full bg-white/5 border border-white/10 flex items-center justify-center"><i class="fa-solid fa-headset text-blue-400 text-lg"></i></div>
                <span class="text-[9px] font-bold text-gray-400 tracking-widest uppercase">Hỗ Trợ 24/7</span>
            </div>
        </div>

    </div>

    <!-- SCRIPT LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, updateProfile, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // CHẶN ZOOM
        document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
        document.addEventListener('dblclick', function(e) { e.preventDefault(); });

        // CONFIG 
        const firebaseConfig = {
            apiKey: "AIzaSyAyYO8ZhxVvOImOZveUJULkK8tdcSxo7pU",
            authDomain: "btccoinbig.firebaseapp.com",
            projectId: "btccoinbig",
            storageBucket: "btccoinbig.firebasestorage.app",
            messagingSenderId: "116892525933",
            appId: "1:116892525933:web:04b0da25f3f933ce162664"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        const EMAIL_PREFIX = "@crownex.com";
        let captchaCodes = { login: '', reg: '' };
        let isHandlingAuthForm = false; 

        // --- SILENT AUTH LISTENER ---
        // Hoạt động ngầm, không hiện Popup tải.
        onAuthStateChanged(auth, async (user) => {
            if (user && !isHandlingAuthForm) {
                // Đã đăng nhập -> Chuyển hướng âm thầm
                try {
                    const docRef = doc(db, "users", user.uid);
                    const docSnap = await getDoc(docRef);
                    if (docSnap.exists()) {
                        saveAndGo(docSnap.data(), user.uid);
                    } else {
                        const fixData = {
                            username: user.email.split('@')[0], phone: "0000000000", fullName: user.displayName || "Thành viên",
                            balance: 0, createdAt: new Date().toISOString(), role: 'user', status: 'active'
                        };
                        await setDoc(docRef, fixData);
                        saveAndGo(fixData, user.uid);
                    }
                } catch (e) {
                    // Nếu lỗi mạng, hiện form ra để ngta tự bấm
                    document.getElementById('appWrapper').classList.remove('opacity-0');
                }
            } else if (!isHandlingAuthForm) {
                // Chưa đăng nhập -> Hiện Form lên
                document.getElementById('appWrapper').classList.remove('opacity-0');
            }
        });

        function saveAndGo(data, uid) {
            data.uid = uid;
            localStorage.setItem('crownex_user_info', JSON.stringify(data));
            window.location.href = "game.html"; // Redirect
        }

        // --- SMOOTH TAB LOGIC & CHỈNH CHIỀU CAO ---
        const HEIGHT_LOGIN = '295px';
        const HEIGHT_REG = '445px';

        window.switchTab = (tab) => {
            const loginForm = document.getElementById('formLogin');
            const regForm = document.getElementById('formRegister');
            const indicator = document.getElementById('tabIndicator');
            const btnLogin = document.getElementById('tabLoginBtn');
            const btnReg = document.getElementById('tabRegBtn');
            const wrapper = document.getElementById('formsWrapper');

            if (tab === 'login') {
                indicator.style.transform = 'translateX(0)';
                btnLogin.classList.add('active'); btnReg.classList.remove('active');
                
                loginForm.classList.remove('slide-left', 'slide-right'); loginForm.classList.add('active');
                regForm.classList.remove('active', 'slide-left'); regForm.classList.add('slide-right');

                wrapper.style.height = HEIGHT_LOGIN;
                window.drawCaptcha('login');
            } else {
                indicator.style.transform = 'translateX(calc(100% + 10px))';
                btnLogin.classList.remove('active'); btnReg.classList.add('active');

                regForm.classList.remove('slide-right', 'slide-left'); regForm.classList.add('active');
                loginForm.classList.remove('active', 'slide-right'); loginForm.classList.add('slide-left');

                wrapper.style.height = HEIGHT_REG;
                window.drawCaptcha('reg');
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
             document.getElementById('formsWrapper').style.height = HEIGHT_LOGIN;
        });

        window.togglePass = (id, btn) => {
            const el = document.getElementById(id);
            const icon = btn.querySelector('i');
            if (el.type === 'password') {
                el.type = 'text';
                icon.classList.remove('fa-eye', 'text-gray-400'); icon.classList.add('fa-eye-slash', 'text-white');
            } else {
                el.type = 'password';
                icon.classList.remove('fa-eye-slash', 'text-white'); icon.classList.add('fa-eye', 'text-gray-400');
            }
        };

        // --- SUBMIT LOGIN ---
        document.getElementById('formLogin').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnLogin');
            const user = document.getElementById('loginUser').value.trim().toLowerCase().replace(/\s/g,'');
            const pass = document.getElementById('loginPass').value;
            const cap = document.getElementById('loginCaptcha').value.toUpperCase();

            if (cap !== captchaCodes.login) {
                window.toast('error', 'Mã xác nhận không đúng!');
                window.drawCaptcha('login'); document.getElementById('loginCaptcha').value = ''; return;
            }

            isHandlingAuthForm = true;
            btn.disabled = true; btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin mr-2"></i> ĐANG XỬ LÝ...`;
            
            try {
                await signInWithEmailAndPassword(auth, user + EMAIL_PREFIX, pass);
                btn.innerHTML = `<i class="fa-solid fa-check mr-2"></i> THÀNH CÔNG!`;
                btn.style.background = 'linear-gradient(135deg, #10b981 0%, #059669 100%)';
                btn.style.color = '#fff';
                setTimeout(() => { window.location.href = "game.html"; }, 500);
            } catch (err) {
                isHandlingAuthForm = false;
                window.toast('error', 'Sai thông tin đăng nhập!');
                btn.disabled = false; btn.innerHTML = `TRUY CẬP HỆ THỐNG`;
                window.drawCaptcha('login'); document.getElementById('loginCaptcha').value = '';
            }
        });

        // --- SUBMIT REGISTER ---
        document.getElementById('formRegister').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnReg');
            const user = document.getElementById('regUser').value.trim().toLowerCase().replace(/\s/g,'');
            const phone = document.getElementById('regPhone').value.trim();
            const pass = document.getElementById('regPass').value;
            const name = document.getElementById('regName').value.trim();
            const cap = document.getElementById('regCaptcha').value.toUpperCase();

            if (cap !== captchaCodes.reg) {
                window.toast('error', 'Mã xác nhận không đúng!');
                window.drawCaptcha('reg'); document.getElementById('regCaptcha').value = ''; return;
            }

            if (!/^[a-zA-Z0-9]+$/.test(user)) { window.toast('error', 'Tên đăng nhập không chứa ký tự đặc biệt!'); return; }

            isHandlingAuthForm = true;
            btn.disabled = true; btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin mr-2"></i> ĐANG TẠO...`;
            
            try {
                const cred = await createUserWithEmailAndPassword(auth, user + EMAIL_PREFIX, pass);
                await updateProfile(cred.user, { displayName: name });
                
                const newData = {
                    username: user, phone: phone, fullName: name,
                    balance: 0, createdAt: new Date().toISOString(), role: 'user', status: 'active'
                };
                await setDoc(doc(db, "users", cred.user.uid), newData);

                window.toast('success', 'Đăng ký thành công!');
                btn.innerHTML = `<i class="fa-solid fa-check mr-2"></i> HOÀN TẤT!`;
                btn.style.background = 'linear-gradient(135deg, #10b981 0%, #059669 100%)';
                btn.style.color = '#fff';
                setTimeout(() => { window.location.href = "game.html"; }, 800);
            } catch (err) {
                isHandlingAuthForm = false;
                let msg = 'Lỗi đăng ký!';
                if(err.code.includes('email-already-in-use')) msg = 'Tên tài khoản đã tồn tại!';
                if(err.code.includes('weak-password')) msg = 'Mật khẩu quá ngắn!';
                window.toast('error', msg);
                btn.disabled = false; btn.innerHTML = `MỞ TÀI KHOẢN NGAY`;
                window.drawCaptcha('reg'); document.getElementById('regCaptcha').value = '';
            }
        });

        // --- UTILS: CAPTCHA & TOAST ---
        window.drawCaptcha = (type) => {
            const canvas = document.getElementById(type === 'login' ? 'canvasLogin' : 'canvasReg');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0,0,canvas.width,canvas.height);
            
            // Vẽ nhiễu nền sang trọng
            for(let i=0; i<35; i++) {
                ctx.fillStyle = `rgba(252, 213, 53, ${Math.random()*0.25})`;
                ctx.beginPath(); ctx.arc(Math.random()*canvas.width, Math.random()*canvas.height, Math.random()*2+1, 0, Math.PI*2); ctx.fill();
            }

            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let code = ''; for(let i=0; i<4; i++) code += chars[Math.floor(Math.random()*chars.length)];
            captchaCodes[type] = code;

            ctx.font = 'bold 24px IBM Plex Mono';
            ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
            for(let i=0; i<4; i++) {
                ctx.save();
                ctx.translate(22 + i*24, 26);
                ctx.rotate((Math.random()-0.5)*0.5);
                ctx.fillStyle = '#FCD535';
                ctx.fillText(code[i], 0, 0);
                ctx.restore();
            }
            
            // Đường gạch nhiễu
            ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.moveTo(0, Math.random()*canvas.height); ctx.lineTo(canvas.width, Math.random()*canvas.height); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, Math.random()*canvas.height); ctx.lineTo(canvas.width, Math.random()*canvas.height); ctx.stroke();
        };

        window.toast = (type, msg) => {
            const box = document.getElementById('toast-box');
            const div = document.createElement('div');
            
            let colorCls = type === 'error' ? 'text-rose-400' : 'text-emerald-400';
            let bgIcon = type === 'error' ? 'bg-rose-500/10 border-rose-500/20' : 'bg-emerald-500/10 border-emerald-500/20';
            let iconClass = type === 'error' ? 'fa-triangle-exclamation' : 'fa-check';

            div.className = `toast-msg`;
            div.innerHTML = `
                <div class="w-8 h-8 rounded-full ${bgIcon} border flex items-center justify-center shrink-0">
                    <i class="fa-solid ${iconClass} ${colorCls} text-sm"></i>
                </div>
                <span class="text-white font-bold text-[13px] leading-tight">${msg}</span>
            `;
            box.appendChild(div);
            setTimeout(() => { div.style.opacity = '0'; setTimeout(() => div.remove(), 300); }, 2500);
        };

        window.drawCaptcha('login');
    </script>
</body>
</html>
