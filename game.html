<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Tpig - Kho Game Web3</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        mono: ['"IBM Plex Mono"', 'monospace'],
                    },
                    colors: {
                        brand: '#00E5FF', 
                        brandDark: '#0077FF', 
                    },
                    animation: {
                        'blob': 'blob 7s infinite',
                    },
                    keyframes: {
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* CSS CORE & NGĂN CHẶN ZOOM/CUỘN THỪA */
        html, body { 
            touch-action: pan-y; 
            overscroll-behavior-y: none; 
            height: 100%; 
            overflow: hidden; 
            background-color: #030712; /* Rất tối, gần đen */
            -webkit-text-size-adjust: 100%;
            color: #f3f4f6;
        }
        body { 
            display: flex; 
            flex-direction: column; 
        }
        
        a, button, input { touch-action: manipulation; outline: none; -webkit-tap-highlight-color: transparent;}
        
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }

        /* AURORA BACKGROUND EFFECT */
        .ambient-bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
        .orb { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.4; animation: blob 10s infinite alternate; }
        .orb-1 { top: -10%; left: -10%; width: 50vw; height: 50vw; background: rgba(0, 229, 255, 0.25); animation-delay: 0s; }
        .orb-2 { bottom: 10%; right: -10%; width: 60vw; height: 60vw; background: rgba(111, 0, 255, 0.2); animation-delay: 2s; }
        .orb-3 { top: 30%; left: 20%; width: 40vw; height: 40vw; background: rgba(0, 119, 255, 0.15); animation-delay: 4s; }

        /* GLASS PANEL (Dành cho thẻ game và UI) */
        .glass-panel {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.01) 100%);
            backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
        }

        /* BOTTOM NAV KÍNH MỜ */
        .bottom-nav { 
            background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); 
            border-top: 1px solid rgba(255,255,255,0.08);
            padding-bottom: env(safe-area-inset-bottom, 10px); 
        }
        .nav-item { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); text-decoration: none; cursor: pointer; color: #64748b; }
        .nav-item.active { color: #00E5FF; text-shadow: 0 0 10px rgba(0,229,255,0.5); }
        .nav-item.active i { transform: translateY(-4px) scale(1.1); }
        .nav-item:not(.active):active { transform: scale(0.9); opacity: 0.7; }

        /* INPUT TÌM KIẾM THEO CHUẨN MỚI */
        .input-control {
            width: 100%; background: rgba(15, 23, 42, 0.6); 
            border: 1px solid rgba(255,255,255,0.06);
            color: #fff; border-radius: 18px;
            transition: all 0.3s ease; box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }
        .input-control:focus {
            border-color: #00E5FF; background: rgba(0, 229, 255, 0.03); 
            outline: none; box-shadow: 0 0 0 1px rgba(0,229,255,0.4), inset 0 2px 4px rgba(0,0,0,0.2);
        }

        /* TOAST - SẮC SẢO, HIỆN ĐẠI */
        #toast { 
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); 
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); 
            border: 1px solid rgba(255,255,255,0.1); border-left: 4px solid #00E5FF;
            padding: 12px 16px; border-radius: 12px; display: flex; align-items: center; gap: 12px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.6); z-index: 9999; opacity: 0; 
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); pointer-events: none; width: max-content; max-width: 90vw;
        }
        #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    </style>
</head>
<body>

    <div class="ambient-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div id="toast">
        <div class="w-8 h-8 rounded-xl bg-[#00E5FF]/10 flex items-center justify-center shrink-0 border border-[#00E5FF]/20">
            <i class="fa-solid fa-bell text-[#00E5FF] text-sm" id="toastIcon"></i>
        </div>
        <span class="text-sm font-semibold text-white tracking-wide" id="toastMsg">...</span>
    </div>

    <header class="flex items-center justify-between px-4 h-[68px] glass-panel rounded-none border-t-0 border-l-0 border-r-0 border-b border-white/[0.08] z-30 shrink-0 sticky top-0">
        <div class="flex items-center gap-3">
            <a href="cskh.html" class="bg-white/5 border border-white/10 px-3 py-2 rounded-xl flex items-center gap-2 active:scale-90 transition-all shadow-sm hover:bg-white/10">
                <i class="fa-solid fa-headset text-[#00E5FF] drop-shadow-[0_0_5px_rgba(0,229,255,0.5)]"></i>
                <span class="text-xs font-bold text-gray-200">CSKH</span>
            </a>
            <!-- Logo Gradient Cyan/Blue -->
            <div class="font-extrabold text-2xl tracking-tight flex items-center gap-1 ml-1 drop-shadow-[0_0_10px_rgba(0,229,255,0.3)]">
                <span class="text-transparent bg-clip-text bg-gradient-to-br from-[#00E5FF] to-[#0077FF]">T</span>PIG
            </div>
        </div>

        <a href="taikhoan.html" class="bg-slate-900/60 pl-3 pr-1 py-1.5 rounded-2xl border border-white/10 flex items-center gap-2 shadow-[inset_0_2px_4px_rgba(0,0,0,0.5)] transition-all active:scale-95 hover:bg-white/5">
            <div class="flex flex-col items-end leading-none">
                <span class="text-[9px] text-[#64748b] font-bold uppercase mb-1 tracking-widest">SỐ DƯ</span>
                <span id="balanceDisplay" class="text-white font-mono text-sm font-bold tracking-tight animate-pulse">...</span>
            </div>
            <!-- Icon Tiền tệ chuẩn Web3 -->
            <div class="w-8 h-8 bg-gradient-to-br from-[#00E5FF] to-[#0077FF] rounded-xl flex items-center justify-center text-[14px] font-black text-white shadow-[0_4px_10px_rgba(0,119,255,0.4)] border border-white/20">
                T

        </a>
    </header>

    <main class="flex-1 overflow-y-auto hide-scroll pb-28 pt-4 px-4 relative z-10 w-full max-w-[600px] mx-auto">
        
        <div class="relative z-10 space-y-5">
            
            <div class="relative group">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                    <i class="fa-solid fa-magnifying-glass text-[#64748b] group-focus-within:text-[#00E5FF] transition-colors"></i>
                </div>
                <input type="text" id="searchGame" placeholder="Tìm kiếm hệ thống dữ liệu..." 
                    class="input-control text-[14px] pl-11 pr-4 py-3.5 placeholder-[#64748b] font-medium">
            </div>

            <div>
                <h3 class="text-white font-bold text-[16px] mb-4 mt-2 flex items-center gap-2 tracking-tight">
                    Hệ Sinh Thái <i class="fa-solid fa-globe text-[#0077FF] animate-pulse drop-shadow-[0_0_8px_rgba(0,119,255,0.6)]"></i>
                </h3>
                
                <div class="grid grid-cols-2 gap-4" id="gameGrid">
                    
                    <!-- 1. Crypto Trade -->
                    <a href="crypto.html" class="glass-panel rounded-2xl p-2.5 flex flex-col gap-3 item-game active:scale-95 transition-transform group" data-name="crypto cripto trade bo bitcoin">
                        <div class="w-full aspect-[4/3] rounded-xl bg-gradient-to-br from-slate-800 to-slate-900 relative overflow-hidden shadow-[inset_0_0_20px_rgba(0,0,0,0.8)] border border-white/5 flex items-center justify-center">
                            <div class="absolute top-2 left-2 bg-[#00E5FF]/20 backdrop-blur-md text-[#00E5FF] text-[9px] px-2 py-0.5 rounded border border-[#00E5FF]/30 z-10 uppercase font-bold tracking-widest">Defi</div>
                            <i class="fa-brands fa-bitcoin text-6xl text-[#00E5FF] drop-shadow-[0_0_15px_rgba(0,229,255,0.5)] group-hover:scale-110 transition-transform duration-500"></i>
                        </div>
                        <div class="px-1 pb-1 flex flex-col items-center">
                            <h4 class="text-gray-100 font-bold text-[13px] truncate w-full text-center tracking-tight">Cripto Trade</h4>
                            <p class="text-[#64748b] text-[10px] uppercase font-bold tracking-widest mt-0.5">Thị Trường</p>
                        </div>
                    </a>

                    <!-- 2. Baccarat -->
                    <a href="bcr.html" class="glass-panel rounded-2xl p-2.5 flex flex-col gap-3 item-game active:scale-95 transition-transform group" data-name="baccarat bài casino">
                        <div class="w-full aspect-[4/3] rounded-xl bg-gradient-to-br from-emerald-900 via-slate-900 to-black relative overflow-hidden shadow-[inset_0_0_20px_rgba(0,0,0,0.8)] border border-emerald-500/20 flex items-center justify-center">
                            <div class="absolute top-2 left-2 bg-emerald-500/20 backdrop-blur-md text-emerald-400 text-[9px] px-2 py-0.5 rounded border border-emerald-500/30 z-10 uppercase font-bold tracking-widest">Live</div>
                            <div class="flex gap-2 items-center group-hover:scale-110 transition-transform duration-500">
                                <i class="fa-solid fa-diamond text-emerald-400 text-3xl rotate-[-15deg] drop-shadow-[0_0_10px_rgba(52,211,153,0.5)]"></i>
                                <i class="fa-solid fa-spade text-white/50 text-4xl rotate-[15deg] drop-shadow-md"></i>
                            </div>
                        </div>
                        <div class="px-1 pb-1 flex flex-col items-center">
                            <h4 class="text-gray-100 font-bold text-[13px] truncate w-full text-center tracking-tight">Baccarat X</h4>
                            <p class="text-[#64748b] text-[10px] uppercase font-bold tracking-widest mt-0.5">Sòng Bài</p>
                        </div>
                    </a>

                    <!-- 3. Drop the boss -->
                    <a href="drop01.html" class="glass-panel rounded-2xl p-2.5 flex flex-col gap-3 item-game active:scale-95 transition-transform group" data-name="drop the boss diệt quái hành động">
                        <div class="w-full aspect-[4/3] rounded-xl bg-gradient-to-br from-purple-900 to-slate-900 relative overflow-hidden shadow-[inset_0_0_20px_rgba(0,0,0,0.8)] border border-purple-500/30 flex items-center justify-center">
                            <div class="absolute top-2 left-2 bg-purple-500/20 backdrop-blur-md text-purple-400 text-[9px] px-2 py-0.5 rounded border border-purple-500/30 z-10 uppercase font-bold tracking-widest">Action</div>
                            <i class="fa-solid fa-ghost text-purple-400 text-5xl drop-shadow-[0_0_15px_rgba(168,85,247,0.6)] group-hover:scale-110 transition-transform duration-500"></i>
                        </div>
                        <div class="px-1 pb-1 flex flex-col items-center">
                            <h4 class="text-gray-100 font-bold text-[13px] truncate w-full text-center tracking-tight">Thợ Săn Boss</h4>
                            <p class="text-[#64748b] text-[10px] uppercase font-bold tracking-widest mt-0.5">Mini Game</p>
                        </div>
                    </a>

                    <!-- 4. Tài Xỉu -->
                    <a href="javascript:void(0)" onclick="window.showMaintenanceToast('Tài Xỉu')" class="glass-panel rounded-2xl p-2.5 flex flex-col gap-3 item-game active:scale-95 transition-transform group" data-name="tài xỉu tai xiu sicbo xúc xắc">
                        <div class="w-full aspect-[4/3] rounded-xl bg-gradient-to-br from-indigo-900 to-slate-900 relative overflow-hidden shadow-[inset_0_0_20px_rgba(0,0,0,0.8)] border border-indigo-500/20 flex items-center justify-center">
                            <div class="absolute top-2 left-2 bg-indigo-500/20 backdrop-blur-md text-indigo-400 text-[9px] px-2 py-0.5 rounded border border-indigo-500/30 z-10 uppercase font-bold tracking-widest">Dice</div>
                            <i class="fa-solid fa-dice text-indigo-400 text-5xl drop-shadow-[0_0_15px_rgba(99,102,241,0.5)] group-hover:rotate-12 transition-transform duration-500"></i>
                        </div>
                        <div class="px-1 pb-1 flex flex-col items-center">
                            <h4 class="text-gray-100 font-bold text-[13px] truncate w-full text-center tracking-tight">Tài Xỉu 3D</h4>
                            <p class="text-[#64748b] text-[10px] uppercase font-bold tracking-widest mt-0.5">Dân Gian</p>
                        </div>
                    </a>

                </div>
                
                <!-- Không tìm thấy -->
                <div id="noResult" class="hidden flex-col items-center justify-center py-10 text-center glass-panel rounded-3xl mt-4">
                    <i class="fa-solid fa-box-open text-4xl text-gray-600 mb-3 drop-shadow-md"></i>
                    <p class="text-gray-400 font-medium text-[13px]">Không tìm thấy dữ liệu!</p>
                </div>
            </div>
        </div>
    </main>

    <div class="bottom-nav fixed bottom-0 left-0 right-0 h-[76px] flex items-center justify-around px-2 z-40 shadow-[0_-10px_30px_rgba(0,0,0,0.8)]">
        
        <!-- Tab 1: TRÒ CHƠI (MAIN / ACTIVE) -->
        <a href="game.html" class="nav-item active flex flex-col items-center justify-center w-[70px] h-full gap-1.5">
            <i class="fa-solid fa-gamepad text-[22px]"></i>
            <span class="text-[10px] font-bold tracking-wide">Trò chơi</span>
        </a>
        
        <!-- Tab 2: NHIỆM VỤ -->
        <a href="nhiemvu.html" class="nav-item flex flex-col items-center justify-center w-[70px] h-full gap-1.5">
            <i class="fa-solid fa-list-check text-[22px]"></i>
            <span class="text-[10px] font-bold tracking-wide">Nhiệm vụ</span>
        </a>
        
        <!-- CENTER BUTTON: NẠP T (Gradient Web3) -->
        <a href="naprut.html" class="relative -top-7 flex flex-col items-center justify-center w-[70px] group">
            <div class="absolute inset-0 bg-[#00E5FF] rounded-full blur-lg opacity-40 group-active:opacity-60 transition-opacity"></div>
            <div class="w-[64px] h-[64px] bg-gradient-to-br from-[#00E5FF] to-[#0077FF] rounded-full flex items-center justify-center shadow-[0_5px_20px_rgba(0,119,255,0.5)] border-[6px] border-[#030712] group-active:scale-95 transition-transform z-10 relative">
                <i class="fa-solid fa-wallet text-2xl text-white drop-shadow-sm"></i>
            </div>
            <span class="text-[10px] font-extrabold text-[#00E5FF] mt-1.5 tracking-wide drop-shadow-md">Giao Dịch</span>
        </a>
        
        <!-- Tab 4: LỊCH SỬ -->
        <a href="lichsu.html" class="nav-item flex flex-col items-center justify-center w-[70px] h-full gap-1.5">
            <i class="fa-solid fa-clock-rotate-left text-[22px]"></i>
            <span class="text-[10px] font-bold tracking-wide">Lịch sử</span>
        </a>
        
        <!-- Tab 5: TÀI KHOẢN -->
        <a href="taikhoan.html" class="nav-item flex flex-col items-center justify-center w-[70px] h-full gap-1.5">
            <i class="fa-solid fa-user text-[22px]"></i>
            <span class="text-[10px] font-bold tracking-wide">Tài khoản</span>
        </a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // CHẶN ZOOM VÀ SCROLL DƯ
        document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
        document.addEventListener('dblclick', function(e) { e.preventDefault(); });

        // FIREBASE CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyAyYO8ZhxVvOImOZveUJULkK8tdcSxo7pU",
            authDomain: "btccoinbig.firebaseapp.com",
            projectId: "btccoinbig",
            storageBucket: "btccoinbig.firebasestorage.app",
            messagingSenderId: "116892525933",
            appId: "1:116892525933:web:04b0da25f3f933ce162664"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // ĐỒNG BỘ SỐ DƯ
        const balanceDisplay = document.getElementById('balanceDisplay');

        function updateBalanceUI(balance) {
            balanceDisplay.innerText = balance.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            balanceDisplay.classList.remove('animate-pulse');
        }

        onAuthStateChanged(auth, (user) => {
            if (user && !user.isAnonymous) {
                onSnapshot(doc(db, "users", user.uid), (docSnap) => {
                    if (docSnap.exists()) {
                        updateBalanceUI(docSnap.data().balance || 0);
                    } else {
                        updateBalanceUI(0);
                    }
                }, (error) => {
                    balanceDisplay.innerText = "Lỗi tải";
                });
            } else {
                let userStr = localStorage.getItem('crownex_user_info');
                if (userStr) {
                    updateBalanceUI(JSON.parse(userStr).balance || 1000); 
                } else {
                    updateBalanceUI(1000); 
                }
            }
        });

        // TOAST HIỆN ĐẠI (Bảo trì)
        let toastTimeout;
        window.showMaintenanceToast = function(gameName) {
            const t = document.getElementById('toast');
            const icon = document.getElementById('toastIcon');
            
            icon.className = 'fa-solid fa-triangle-exclamation text-[#f43f5e] text-sm drop-shadow-[0_0_5px_rgba(244,63,94,0.5)]';
            t.querySelector('div').className = 'w-8 h-8 rounded-xl bg-[#f43f5e]/10 flex items-center justify-center shrink-0 border border-[#f43f5e]/20';
            t.style.borderLeftColor = '#f43f5e';
            
            document.getElementById('toastMsg').innerText = `Dữ liệu đang được đồng bộ...`;
            
            t.classList.add('show');
            if(toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => { t.classList.remove('show'); }, 3000);
        }

        // TÌM KIẾM
        const searchInput = document.getElementById('searchGame');
        const gameItems = document.querySelectorAll('.item-game');
        const noResultDiv = document.getElementById('noResult');

        if(searchInput) {
            searchInput.addEventListener('input', function(e) {
                const searchTerm = e.target.value.toLowerCase().trim();
                let foundCount = 0;

                gameItems.forEach(item => {
                    const gameKeywords = item.getAttribute('data-name');
                    if (gameKeywords.includes(searchTerm)) {
                        item.style.display = 'flex';
                        foundCount++;
                    } else {
                        item.style.display = 'none';
                    }
                });

                if (foundCount === 0) {
                    noResultDiv.classList.remove('hidden');
                    noResultDiv.classList.add('flex');
                } else {
                    noResultDiv.classList.add('hidden');
                    noResultDiv.classList.remove('flex');
                }
            });
        }
    </script>
</body>
</html>
