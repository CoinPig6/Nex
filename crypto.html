        // --- MATH & SEED LOGIC ---
        function seededRandom(seed) {
            let t = seed += 0x6D2B79F5;
            t = Math.imul(t ^ t >>> 15, t | 1);
            t ^= t + Math.imul(t ^ t >>> 7, t | 61);
            return ((t ^ t >>> 14) >>> 0) / 4294967296;
        }

        // TỐI ƯU TỈ LỆ: GIẢM MÂY ĐEN, TĂNG HỐ ĐEN
        function getDeterministicResult(epoch) {
            const rand = seededRandom(epoch * 12345 + 6789);
            // Mặc định là 0.5 (50-50). Đổi thành 0.35 nghĩa là:
            // rand > 0.35 => UP (Xanh) chiếm 65% (Tăng hố đen)
            // rand <= 0.35 => DOWN (Đỏ) chiếm 35% (Giảm mây đen)
            return rand > 0.35 ? 'up' : 'down';
        }

        function getCandleParams(epoch) {
            const rand = seededRandom(epoch * 123);
            const dir = getDeterministicResult(epoch); 
            
            let r1 = seededRandom(epoch * 11);
            let r2 = seededRandom(epoch * 22);
            let r3 = seededRandom(epoch * 33);
            
            let f1 = (1 + r1 * 3) * Math.PI * 2; 
            let f2 = (3 + r2 * 5) * Math.PI * 2; 
            let f3 = (8 + r3 * 8) * Math.PI * 2; 
            
            let a1 = 12 + r1 * 15;
            let a2 = 6 + r2 * 8;
            let a3 = 2 + r3 * 4;
            
            const getRawNoise = (t) => Math.sin(t * f1) * a1 + Math.cos(t * f2) * a2 + Math.sin(t * f3) * a3;
            const initialNoise = getRawNoise(0); 
            const getNoise = (t) => getRawNoise(t) - initialNoise; 
            
            let macroMove = dir === 'up' ? (20 + rand * 30) : -(20 + rand * 30);
            
            let endNoise = getNoise(1.0);
            let finalChange = macroMove + endNoise;
            
            if (dir === 'up' && finalChange <= 2) {
                finalChange = 5 + rand * 15;
                macroMove = finalChange - endNoise; 
            }
            if (dir === 'down' && finalChange >= -2) {
                finalChange = -(5 + rand * 15);
                macroMove = finalChange - endNoise; 
            }
            
            return { macroMove, getNoise, finalChange };
        }

        async function syncRealPrice() {
            try {
                const response = await fetch('https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT');
                const data = await response.json();
                const realPrice = parseFloat(data.price);
                const currentEpoch = Math.floor(Date.now() / 30000);
                let totalHistoricalChange = 0;
                for (let e = currentEpoch - 60; e < currentEpoch; e++) {
                    totalHistoricalChange += getCandleParams(e).finalChange;
                }
                CONFIG.basePrice = realPrice - totalHistoricalChange;
            } catch (error) {
                CONFIG.basePrice = 65000;
            }
        }

        function buildBaseCandles(existingCandles = []) {
            const currentEpoch = Math.floor(Date.now() / 30000);
            let simPrice = CONFIG.basePrice; 
            let cands = [];
            
            for (let e = currentEpoch - 60; e <= currentEpoch; e++) {
                const params = getCandleParams(e);
                const open = simPrice;
                const close = open + params.finalChange;
                
                let high, low;
                if (e === currentEpoch) {
                    const existing = existingCandles.find(c => c.epoch === e);
                    if (existing) { high = existing.high; low = existing.low; } 
                    else { high = open; low = open; }
                } else {
                    high = Math.max(open, close) + seededRandom(e*321) * 15 + 5;
                    low = Math.min(open, close) - seededRandom(e*456) * 15 - 5;
                    const existing = existingCandles.find(c => c.epoch === e);
                    if (existing) { high = Math.max(high, existing.high, open, close); low = Math.min(low, existing.low, open, close); }
                }
                
                cands.push({ epoch: e, open, close, high, low, change: params.finalChange });
                simPrice = close; 
            }
            return cands;
        }

        const cvs = document.getElementById('chartCanvas'); const ctx = cvs.getContext('2d');
        function resizeCanvas() { cvs.width = cvs.parentElement.offsetWidth; cvs.height = cvs.parentElement.offsetHeight; }

        function gameLoop() {
            const now = Date.now();
            const currentEpoch = Math.floor(now / 30000);
            const isResultPhase = currentEpoch % 2 !== 0; 
            const progress = (now % 30000) / 30000;

            if (state.lastEpoch !== currentEpoch) {
                state.baseCandles = buildBaseCandles(state.baseCandles); 
                state.lastEpoch = currentEpoch;
                
                if (isResultPhase) {
                    state.lockPrice = state.baseCandles[state.baseCandles.length - 1].open;
                    document.getElementById('lockPriceText').innerText = state.lockPrice.toFixed(2);
                    document.getElementById('lockLine').style.display = 'block'; document.getElementById('lockLabel').style.display = 'block';
                    
                    document.getElementById('phaseText').innerText = "CHỜ KẾT QUẢ";
                    document.getElementById('candleStatusBadge').innerText = "CHỜ KẾT QUẢ";
                    document.getElementById('candleStatusBadge').className = "text-[10px] font-black px-4 py-1.5 rounded-full uppercase tracking-widest bg-blue-500/20 text-blue-400 border border-blue-500/50 backdrop-blur-md";
                    document.getElementById('btnBuy').classList.add('dimmed'); document.getElementById('btnSell').classList.add('dimmed');
                    window.cancelSelection();
                } else {
                    document.getElementById('lockLine').style.display = 'none'; document.getElementById('lockLabel').style.display = 'none';
                    
                    document.getElementById('phaseText').innerText = "ĐẶT LỆNH";
                    document.getElementById('candleStatusBadge').innerText = "MỞ ĐẶT LỆNH";
                    document.getElementById('candleStatusBadge').className = "text-[10px] font-black px-4 py-1.5 rounded-full uppercase tracking-widest bg-green-500/20 text-[#0ECB81] border border-green-500/50 backdrop-blur-md";
                    document.getElementById('badge-up').classList.add('hidden'); document.getElementById('badge-down').classList.add('hidden');
                    document.getElementById('btnBuy').classList.remove('dimmed', 'locked'); document.getElementById('btnSell').classList.remove('dimmed', 'locked');
                    
                    finalizeRound(); 
                }
                regenerateHistory(); 
            }

            const liveCandle = state.baseCandles[state.baseCandles.length - 1];
            const params = getCandleParams(currentEpoch);
            const t = progress; 
            const smoothT = t * t * (3 - 2 * t);
            
            let baseTrajectory = liveCandle.open + params.macroMove * smoothT;
            state.visualPrice = baseTrajectory + params.getNoise(t);

            liveCandle.close = state.visualPrice;
            liveCandle.high = Math.max(liveCandle.open, state.visualPrice, liveCandle.high);
            liveCandle.low = Math.min(liveCandle.open, state.visualPrice, liveCandle.low);

            const liveDot = document.getElementById('liveDot');
            if (liveDot) liveDot.className = state.visualPrice >= liveCandle.open ? 'dot new up' : 'dot new down';

            const VISIBLE_CANDLES = 22; 
            const w = (cvs.width - CONFIG.chartPaddingRight) / VISIBLE_CANDLES; 
            
            let highestVisible = state.visualPrice; let lowestVisible = state.visualPrice;
            const startIndex = Math.max(0, state.baseCandles.length - VISIBLE_CANDLES);
            for (let i = startIndex; i < state.baseCandles.length; i++) {
                if (state.baseCandles[i].high > highestVisible) highestVisible = state.baseCandles[i].high;
                if (state.baseCandles[i].low < lowestVisible) lowestVisible = state.baseCandles[i].low;
            }
            
            let priceDiff = highestVisible - lowestVisible;
            if (priceDiff < 60) { let mid = (highestVisible + lowestVisible) / 2; highestVisible = mid + 30; lowestVisible = mid - 30; }

            const pixelPadding = 45; 
            const availableHeightRatio = 1 - (2 * pixelPadding / cvs.height);
            const r = (highestVisible - lowestVisible) / availableHeightRatio; 
            const min = lowestVisible - (pixelPadding / cvs.height) * r;

            ctx.clearRect(0, 0, cvs.width, cvs.height);
            
            // DRAW BACKGROUND GRID (TRADING VIEW STYLE)
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)'; ctx.lineWidth = 1;
            for(let i = 0; i < cvs.width; i+= w*3) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, cvs.height); ctx.stroke(); }

            for(let p = Math.floor(min / 10) * 10; p < min + r; p += 10) {
                const y = cvs.height - ((p - min) / r * cvs.height);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)'; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(cvs.width, y); ctx.stroke();
                ctx.fillStyle = '#6b7280'; ctx.font = '10px IBM Plex Mono'; ctx.fillText(p, cvs.width - 45, y + 4);
            }

            if (isResultPhase) {
                const yl = cvs.height - ((state.lockPrice - min) / r * cvs.height);
                document.getElementById('lockLine').style.top = yl + 'px'; document.getElementById('lockLabel').style.top = yl + 'px';
                ctx.strokeStyle = '#FCD535'; ctx.lineWidth = 1.5; ctx.setLineDash([5, 5]); 
                ctx.beginPath(); ctx.moveTo(0, yl); ctx.lineTo(cvs.width, yl); ctx.stroke(); ctx.setLineDash([]);
            }

            const lastIdx = state.baseCandles.length - 1;
            for (let i = 0; i <= lastIdx; i++) {
                const dist = lastIdx - i;
                if (dist > VISIBLE_CANDLES) continue; 

                const x = (cvs.width - CONFIG.chartPaddingRight) - (dist * w) - (w/2);
                const c = state.baseCandles[i];
                
                const yO = cvs.height - ((c.open - min) / r * cvs.height); 
                const yC = cvs.height - ((c.close - min) / r * cvs.height);
                const yH = cvs.height - ((c.high - min) / r * cvs.height); 
                const yL = cvs.height - ((c.low - min) / r * cvs.height);
                
                const isGreen = c.close >= c.open;
                ctx.fillStyle = isGreen ? '#0ECB81' : '#F6465D'; 
                ctx.strokeStyle = ctx.fillStyle;

                // Wicks
                ctx.lineWidth = 1.5;
                ctx.beginPath(); ctx.moveTo(x, yH); ctx.lineTo(x, yL); ctx.stroke();
                
                // Body with slight glow
                const bodyH = Math.max(Math.abs(yC - yO), 2.5);
                const candleWidth = w * 0.7;
                
                ctx.shadowColor = isGreen ? 'rgba(14, 203, 129, 0.4)' : 'rgba(246, 70, 93, 0.4)';
                ctx.shadowBlur = 4;
                ctx.fillRect(x - (candleWidth/2), Math.min(yO, yC), candleWidth, bodyH);
                ctx.shadowBlur = 0; // reset
            }

            const yc = cvs.height - ((state.visualPrice - min) / r * cvs.height);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)'; ctx.setLineDash([3, 3]); ctx.beginPath(); ctx.moveTo(0, yc); ctx.lineTo(cvs.width, yc); ctx.stroke(); ctx.setLineDash([]);
            
            const liveIsGreen = state.visualPrice >= liveCandle.open;
            ctx.fillStyle = liveIsGreen ? '#0ECB81' : '#F6465D';
            ctx.shadowColor = liveIsGreen ? 'rgba(14, 203, 129, 0.6)' : 'rgba(246, 70, 93, 0.6)'; 
            ctx.shadowBlur = 8;
            ctx.beginPath(); ctx.roundRect(cvs.width - 65, yc - 13, 65, 26, 6); ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#000'; ctx.font = 'bold 13px IBM Plex Mono';
            ctx.fillText(state.visualPrice.toFixed(2), cvs.width - 60, yc + 4);
            
            requestAnimationFrame(gameLoop);
        }
    </script>
