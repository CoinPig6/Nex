<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Tpig - Tài khoản</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        /* CSS CORE & NGĂN CHẶN ZOOM/CUỘN THỪA */
        html, body { 
            touch-action: pan-y; 
            overscroll-behavior-y: none; 
            height: 100%; 
            overflow: hidden; 
            background-color: #050507; 
            -webkit-text-size-adjust: 100%;
        }
        body { 
            color: #d1d5db; 
            font-family: 'Roboto', sans-serif; 
            display: flex; 
            flex-direction: column; 
            background-image: radial-gradient(circle at top, rgba(30, 41, 59, 0.4) 0%, transparent 70%);
        }
        .font-mono { font-family: 'IBM Plex Mono', monospace; }
        
        a, button, input, select, textarea { touch-action: manipulation; outline: none; -webkit-tap-highlight-color: transparent;}
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }

        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

        /* BOTTOM NAV */
        .bottom-nav { background: rgba(5, 5, 7, 0.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); padding-bottom: env(safe-area-inset-bottom, 10px); }
        .nav-item { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); text-decoration: none; cursor: pointer; }
        .nav-item.active { color: #FCD535; }
        .nav-item.active i { transform: translateY(-4px) scale(1.1); text-shadow: 0 4px 12px rgba(252,213,53,0.5); }
        .nav-item:not(.active):active { transform: scale(0.9); opacity: 0.7; }

        /* GLASSMORPHISM CARDS */
        .glass-card {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.03) 0%, rgba(255, 255, 255, 0.01) 100%);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05); 
            border-radius: 20px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.05); 
        }

        /* INPUTS - BẮT BUỘC 16PX ĐỂ CHỐNG ZOOM IOS */
        .input-dark {
            width: 100%; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1);
            color: #fff; padding: 14px 16px; border-radius: 14px; 
            font-size: 16px !important; /* QUAN TRỌNG: Phải >= 16px */
            transition: all 0.3s;
            appearance: none; -webkit-appearance: none;
            backdrop-filter: blur(4px);
        }
        .input-dark:focus { border-color: #FCD535; outline: none; box-shadow: 0 0 0 1px #FCD535, inset 0 2px 5px rgba(0,0,0,0.5); background: rgba(255,255,255,0.02); }
        .input-readonly { background: rgba(255,255,255,0.02); color: #6b7280; border-color: rgba(255,255,255,0.05); cursor: not-allowed; }

        /* ACCORDION ANIMATION */
        .accordion-content {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.3s ease-out;
        }
        .accordion-content.open { grid-template-rows: 1fr; }
        .accordion-inner { overflow: hidden; }
    </style>
</head>
<body>

    <!-- HEADER BAR -->

        <div class="relative z-10">

                </div>
            </div>

            <!-- BALANCE BIG CARD -->
            <div class="glass-card p-5 mb-5 relative overflow-hidden">
                <div class="absolute -right-10 -bottom-10 w-40 h-40 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none"></div>

                <div class="flex gap-3 relative z-10">
                    <a href="naprut.html" class="flex-1 bg-gradient-to-b from-[#86efac] to-[#4ade80] text-emerald-950 font-bold py-3.5 rounded-[14px] flex items-center justify-center gap-2 shadow-[0_4px_15px_rgba(74,222,128,0.25)] hover:brightness-110 active:scale-95 transition-all text-sm tracking-wide">

            <!-- QUẢN LÝ NGÂN HÀNG (Accordion) -->

                                        <button type="button" onclick="window.toggleBankDropdown(event)" class="absolute right-0 top-0 h-full px-4 text-gray-400 hover:text-white transition-colors flex items-center justify-center">

                                        <!-- Dropdown List -->

                                <div class="relative z-10">

                                    <input type="number" id="bankNumber" class="input-dark font-mono text-[#FCD535] tracking-widest placeholder-gray-600" placeholder="Nhập số tài khoản/ví" inputmode="numeric" pattern="[0-9]*">

                                <div class="relative z-10">
                                    <label class="text-[10px] text-gray-400 font-bold uppercase block mb-2 pl-1 tracking-widest">Chủ Tài Khoản</label>
                                    <input type="text" id="bankOwner" class="input-dark uppercase font-bold input-readonly" readonly placeholder="HỌ VÀ TÊN">

                                <button onclick="window.saveBankInfo()" class="relative z-10 w-full bg-gradient-to-r from-emerald-500 to-emerald-600 text-white font-bold py-3.5 rounded-xl text-sm shadow-[0_4px_15px_rgba(16,185,129,0.3)] hover:brightness-110 active:scale-95 transition-all tracking-wider mt-2" id="btnSaveBank">
                                    LƯU LIÊN KẾT
                                </button>
                            </div>
                        </div>

                    </div>
                </div>

            <!-- MENU LIST CÁ NHÂN -->
            <div class="glass-card overflow-hidden p-0 mb-6 border border-white/10">
                <div class="flex justify-between items-center p-4 border-b border-white/5 hover:bg-white/[0.02] transition">
                    <div class="flex items-center gap-3.5">
                        <i class="fa-regular fa-id-card text-gray-400 text-[18px] w-6 text-center"></i>
                        <span class="text-gray-200 text-[14px] font-medium tracking-wide">ID Tài khoản</span>
                    </div>
                    <div class="flex items-center gap-2 text-gray-500">

                <div class="flex justify-between items-center p-4 border-b border-white/5 hover:bg-white/[0.02] transition">

                        <i class="fa-solid fa-mobile-screen text-gray-400 text-[18px] w-6 text-center"></i>

                    </div>
                    <div class="flex items-center gap-2 text-gray-500">
                        <span class="text-xs font-mono" id="infoPhone">...</span>
                        <i class="fa-solid fa-chevron-right text-[10px]"></i>
                    </div>
                </div>

                <div class="flex justify-between items-center p-4 border-b border-white/5 hover:bg-white/[0.02] transition">
                    <div class="flex items-center gap-3.5">
                        <i class="fa-regular fa-calendar-check text-gray-400 text-[18px] w-6 text-center"></i>
                        <span class="text-gray-200 text-[14px] font-medium tracking-wide">Ngày tham gia</span>
                    </div>
                    <div class="flex items-center gap-2 text-gray-500">

                    </div>
                </div>

                <button onclick="window.logout()" class="w-full flex justify-between items-center p-4 hover:bg-white/[0.02] transition active:scale-95 cursor-pointer bg-rose-500/5">
                    <div class="flex items-center gap-3.5">
                        <i class="fa-solid fa-arrow-right-from-bracket text-rose-400 text-[18px] w-6 text-center"></i>
                        <span class="text-rose-400 font-bold text-[14px] tracking-wide">Đăng xuất</span>
                    </div>
                    <i class="fa-solid fa-chevron-right text-[10px] text-gray-500"></i>
                </button>
            </div>

            <p class="text-center text-[10px] text-gray-600 mt-2 font-mono font-bold tracking-widest pb-4">TPIG APP V30.2.3 • BUID: <span id="appVersionID">...</span></p>
        </div>
    </main>

    <!-- BOTTOM NAVIGATION -->
    <div class="bottom-nav fixed bottom-0 left-0 right-0 h-[72px] border-t border-white/10 flex items-center justify-around px-2 z-40 shadow-[0_-10px_30px_rgba(0,0,0,0.5)]">

    <!-- FIREBASE & LOGIC SCRIPT -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, updateDoc, onSnapshot, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
        document.addEventListener('dblclick', function(e) { e.preventDefault(); });

        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', function() {
                setTimeout(() => { document.getElementById('mainScrollArea').scrollTop += 50; }, 200);
            });
        });

        const firebaseConfig = {
            apiKey: "AIzaSyAyYO8ZhxVvOImOZveUJULkK8tdcSxo7pU",
            authDomain: "btccoinbig.firebaseapp.com",
            projectId: "btccoinbig",
            storageBucket: "btccoinbig.firebasestorage.app",
            messagingSenderId: "116892525933",
            appId: "1:116892525933:web:04b0da25f3f933ce162664"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        let currentUserUID = null;
        let globalUserBanks = [];

        document.getElementById('appVersionID').innerText = Math.floor(Math.random()*90000)+10000;

        // --- CẤU HÌNH NGÂN HÀNG & AUTO-CORRECT ---
        const BANK_LIST = [
            "Ví Điện Tử MoMo", "Vietcombank", "Techcombank", "MB Bank", "ACB",
            "VietinBank", "BIDV", "VPBank", "Agribank", "TPBank", "Sacombank",
            "VIB", "MSB", "OCB", "Eximbank"
        ];

        const BANK_ALIASES = {
            'mb': 'MB Bank', 'mbbank': 'MB Bank',
            'tech': 'Techcombank', 'techcom': 'Techcombank',
            'vcb': 'Vietcombank', 'vietcom': 'Vietcombank',
            'vietin': 'VietinBank', 'ctg': 'VietinBank',
            'bidv': 'BIDV',
            'vp': 'VPBank', 'vpbank': 'VPBank',
            'agri': 'Agribank', 'agribank': 'Agribank',
            'momo': 'Ví Điện Tử MoMo',
            'tp': 'TPBank', 'tpbank': 'TPBank',
            'sacom': 'Sacombank', 'vib': 'VIB', 'msb': 'MSB', 'ocb': 'OCB', 'exim': 'Eximbank'
        };

        // UI ACTIONS BANK
        window.toggleBankSection = () => {
            const content = document.getElementById('bankContent');
            const icon = document.getElementById('bankChevron');
            const header = document.getElementById('bankHeaderBtn');
            
            if (content.classList.contains('open')) {
                content.classList.remove('open');
                icon.style.transform = 'rotate(0deg)';
                header.style.borderColor = 'transparent';
                window.hideAddBankForm(); 
            } else {
                content.classList.add('open');
                icon.style.transform = 'rotate(180deg)';
                header.style.borderColor = 'rgba(255,255,255,0.05)';
            }
        };

        window.showAddBankForm = () => {
            document.getElementById('btnAddBankWrap').classList.add('hidden');
            document.getElementById('addBankFormContainer').classList.remove('hidden');
            document.getElementById('bankNumber').value = '';
            document.getElementById('bankName').value = '';
            window.checkBankType();
            renderBankDropdown();
        };

        window.hideAddBankForm = () => {
            if(globalUserBanks.length < 2) {
                document.getElementById('btnAddBankWrap').classList.remove('hidden');
            }
            document.getElementById('addBankFormContainer').classList.add('hidden');
            document.getElementById('bankDropdown').classList.add('hidden');
        };

        // --- COMBO-BOX LOGIC ---
        function renderBankDropdown() {
            const dropdown = document.getElementById('bankDropdown');
            let html = '<div class="py-2">';
            BANK_LIST.forEach(bank => {
                const isMomo = bank.includes('MoMo');
                const textColor = isMomo ? 'text-pink-500 font-bold' : 'text-gray-300 hover:text-white';
                html += `<div class="px-4 py-2.5 cursor-pointer hover:bg-white/10 transition-colors text-[16px] ${textColor}" onclick="window.selectBankFromDropdown('${bank}')">${bank}</div>`;
            });
            html += '</div>';
            dropdown.innerHTML = html;
        }

        window.toggleBankDropdown = (e) => {
            if(e) e.stopPropagation();
            const dropdown = document.getElementById('bankDropdown');
            const icon = document.getElementById('bankDropdownIcon');
            if (dropdown.classList.contains('hidden')) {
                dropdown.classList.remove('hidden');
                icon.style.transform = 'rotate(180deg)';
            } else {
                dropdown.classList.add('hidden');
                icon.style.transform = 'rotate(0deg)';
            }
        };

        window.selectBankFromDropdown = (bankName) => {
            const input = document.getElementById('bankName');
            input.value = bankName;
            window.toggleBankDropdown();
            window.checkBankType();
        };

        document.addEventListener('click', (e) => {
            const dropdown = document.getElementById('bankDropdown');
            const inputWrap = document.getElementById('bankName').parentElement;
            if (!dropdown.classList.contains('hidden') && !inputWrap.contains(e.target)) {
                dropdown.classList.add('hidden');
                document.getElementById('bankDropdownIcon').style.transform = 'rotate(0deg)';
            }
        });

        // AUTO-CORRECT
        window.formatBankName = (inputElem) => {
            let val = inputElem.value.trim().toLowerCase();
            if (val === '') return;

            if (BANK_ALIASES[val]) {
                inputElem.value = BANK_ALIASES[val];
            } else {
                inputElem.value = inputElem.value.replace(/\b\w/g, l => l.toUpperCase());
            }
            window.checkBankType();
        };

        window.checkBankType = () => {
            const val = document.getElementById('bankName').value.toLowerCase();
            const label = document.getElementById('labelBankNumber');
            const inputNum = document.getElementById('bankNumber');

            if (val.includes('momo')) {
                label.innerText = 'SỐ ĐIỆN THOẠI VÍ MOMO';
                inputNum.placeholder = 'Nhập số điện thoại ví Momo';
            } else {
                label.innerText = 'SỐ TÀI KHOẢN';
                inputNum.placeholder = 'Nhập số tài khoản/ví';
            }
        };

        window.logout = () => {
            if(confirm('Bạn có chắc chắn muốn đăng xuất tài khoản?')) {
                signOut(auth).then(() => {
                    localStorage.removeItem('crownex_user_info');
                    window.location.href = "login.html";
                });
            }
        };

        // LƯU NGÂN HÀNG MỚI
        window.saveBankInfo = async () => {
            const inputElem = document.getElementById('bankName');
            window.formatBankName(inputElem); 
            
            const bankName = inputElem.value;
            const bankNumber = document.getElementById('bankNumber').value.trim();
            const bankOwner = document.getElementById('bankOwner').value.trim();

            if (!bankName || !bankNumber) { alert("Vui lòng nhập/chọn ngân hàng và nhập số tài khoản!"); return; }
            if (!currentUserUID) return;
            if (globalUserBanks.length >= 2) { alert("Bạn chỉ được liên kết tối đa 2 ngân hàng!"); return; }

            const btn = document.getElementById('btnSaveBank');
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-2"></i> ĐANG KIỂM TRA...';
            btn.disabled = true;

            try {
                const usersRef = collection(db, "users");
                const q1 = query(usersRef, where("bankNumber", "==", bankNumber));
                const snap1 = await getDocs(q1);
                const q2 = query(usersRef, where("bankNumbers", "array-contains", bankNumber));
                const snap2 = await getDocs(q2);

                let isDuplicate = false;
                snap1.forEach(doc => { if (doc.id !== currentUserUID) isDuplicate = true; });
                snap2.forEach(doc => { if (doc.id !== currentUserUID) isDuplicate = true; });

                if (isDuplicate) {
                    alert("LỖI: Số tài khoản/ví này đã được liên kết bởi người dùng khác!");
                    btn.innerHTML = 'LƯU LIÊN KẾT';
                    btn.disabled = false;
                    return; 
                }

                btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-2"></i> ĐANG LƯU...';
                
                const newBank = { bankName, bankNumber, bankOwner };
                const updatedBanks = [...globalUserBanks, newBank];
                const updatedBankNumbers = updatedBanks.map(b => b.bankNumber);

                let updateData = { banks: updatedBanks, bankNumbers: updatedBankNumbers, isBankVerified: true };

                if (globalUserBanks.length === 0) {
                    updateData.bankName = bankName;
                    updateData.bankNumber = bankNumber;
                    updateData.bankOwner = bankOwner;
                }

                await updateDoc(doc(db, "users", currentUserUID), updateData);
                
                alert("Liên kết thành công!");
                window.hideAddBankForm();
                btn.innerHTML = 'LƯU LIÊN KẾT';
                btn.disabled = false;

            } catch (error) {
                console.error(error);
                alert("Lỗi hệ thống. Vui lòng thử lại.");
                btn.innerHTML = 'LƯU LIÊN KẾT';
                btn.disabled = false;
            }
        };

        // KIỂM TRA ĐĂNG NHẬP & ĐỒNG BỘ DỮ LIỆU
        onAuthStateChanged(auth, async (user) => {
            if (user && !user.isAnonymous) {
                currentUserUID = user.uid;
                const userRef = doc(db, "users", user.uid);
                
                const localData = JSON.parse(localStorage.getItem('crownex_user_info'));
                if(localData) renderData(localData, user.uid);

                onSnapshot(userRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        renderData(data, user.uid);
                        data.uid = user.uid;
                        localStorage.setItem('crownex_user_info', JSON.stringify(data));
                    } else {
                        renderData({ balance: 0, fullName: "Player", username: "new_player" }, user.uid);
                    }
                }, (error) => {
                    console.error("Lỗi đồng bộ dữ liệu: ", error);
                });
            } else {
                window.location.href = "login.html";
            }
        });

        // HÀM HIỂN THỊ DỮ LIỆU
        function renderData(data, uid) {
            document.getElementById('displayFullname').innerText = data.fullName ? data.fullName.toUpperCase() : "TPIG PLAYER";
            document.getElementById('displayUsername').innerText = data.username || "player";
            document.getElementById('bankOwner').value = data.fullName ? data.fullName.toUpperCase() : "CHƯA CẬP NHẬT TÊN";
            
            const bal = data.balance || 0;
            const formattedBalance = bal.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            document.getElementById('displayBalanceMain').innerText = formattedBalance;
            const headerBal = document.getElementById('balanceDisplayHeader');
            headerBal.innerText = formattedBalance;
            headerBal.classList.remove('animate-pulse');
            
            document.getElementById('infoPhone').innerText = data.phone || "Chưa cập nhật";
            document.getElementById('infoID').innerText = uid;
            const d = data.createdAt ? new Date(data.createdAt) : new Date();
            document.getElementById('infoDate').innerText = d.toLocaleDateString('vi-VN');

            let banks = [];
            if (data.banks && Array.isArray(data.banks)) {
                banks = data.banks;
            } else if (data.bankNumber) {
                banks = [{ bankName: data.bankName, bankNumber: data.bankNumber, bankOwner: data.bankOwner }];
            }
            globalUserBanks = banks;
            
            document.getElementById('bankCountBadge').innerText = `${banks.length}/2`;

            const listContainer = document.getElementById('bankListContainer');
            if (banks.length > 0) {
                let html = '';
                banks.forEach((b, index) => {
                    const maskedNum = b.bankNumber.length > 4 ? "****" + b.bankNumber.slice(-4) : b.bankNumber;
                    html += `
                        <div class="bg-white/5 border border-white/10 rounded-xl p-3.5 flex items-center justify-between shadow-sm">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-lg bg-black/40 border border-white/5 flex items-center justify-center shadow-inner">
                                    <i class="fa-solid fa-building-columns text-gray-400"></i>
                                </div>
                                <div>
                                    <p class="text-[14px] font-bold text-white mb-0.5">${b.bankName}</p>
                                    <p class="text-[12px] text-[#FCD535] font-mono tracking-widest">${maskedNum}</p>
                                </div>
                            </div>
                            <span class="text-[10px] bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2 py-0.5 rounded font-bold uppercase tracking-wider shadow-sm">Đã LK</span>
                        </div>
                    `;
                });
                listContainer.innerHTML = html;
            } else {
                listContainer.innerHTML = `<div class="text-center py-4 text-gray-500 text-[13px] italic">Chưa có ngân hàng nào được liên kết.</div>`;
            }

            if (banks.length >= 2) {
                document.getElementById('btnAddBankWrap').classList.add('hidden');
                document.getElementById('addBankFormContainer').classList.add('hidden');
            } else if (!document.getElementById('bankContent').classList.contains('open') || document.getElementById('addBankFormContainer').classList.contains('hidden')) {
                document.getElementById('btnAddBankWrap').classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
