<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Tpig - Sảnh Casino</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        html, body { touch-action: pan-y; overscroll-behavior-y: none; height: 100%; overflow: hidden; background-color: #050507; -webkit-text-size-adjust: 100%; }
        body { color: #d1d5db; font-family: 'Roboto', sans-serif; display: flex; flex-direction: column; background-image: radial-gradient(circle at top, rgba(30, 41, 59, 0.4) 0%, transparent 70%); }
        .font-mono { font-family: 'IBM Plex Mono', monospace; }
        a, button { touch-action: manipulation; outline: none; -webkit-tap-highlight-color: transparent;}
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        #toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); background: rgba(20, 24, 34, 0.9); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); padding: 10px 16px; border-radius: 100px; display: flex; align-items: center; gap: 12px; box-shadow: 0 20px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1); z-index: 9999; opacity: 0; transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); pointer-events: none; width: max-content; max-width: 90vw;}
        #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    </style>
</head>
<body>
    <div id="toast">
        <div class="w-8 h-8 rounded-full bg-[#FCD535]/10 flex items-center justify-center shrink-0 border border-[#FCD535]/30">
            <i class="fa-solid fa-gamepad text-[#FCD535] text-sm drop-shadow-[0_0_5px_rgba(252,213,53,0.5)]" id="toastIcon"></i>
        </div>
        <span class="text-sm font-semibold text-white tracking-wide" id="toastMsg">...</span>
    </div>

    <!-- HEADER BAR -->
    <header class="flex items-center justify-between px-4 h-16 bg-black/40 backdrop-blur-xl border-b border-white/[0.05] z-30 shrink-0 sticky top-0 shadow-lg shadow-black/20">
        <a href="game.html" class="w-10 h-10 rounded-full bg-white/5 border border-white/10 flex items-center justify-center text-white active:scale-90 transition-transform shadow-sm hover:bg-white/10">
            <i class="fa-solid fa-chevron-left"></i>
        </a>
        <div class="absolute left-1/2 transform -translate-x-1/2 flex flex-col items-center">
            <h1 class="font-black text-[15px] md:text-[17px] text-emerald-400 tracking-widest uppercase drop-shadow-md flex items-center gap-2">
                <i class="fa-solid fa-dharmachakra"></i> SẢNH CASINO
            </h1>
        </div>
        <a href="taikhoan.html" class="bg-black/50 pl-3 pr-1 py-1 rounded-full border border-white/10 flex items-center gap-2 shadow-[inset_0_2px_4px_rgba(0,0,0,0.5)] transition-all active:scale-95 hover:bg-white/5">
            <div class="flex flex-col items-end leading-none">
                <span class="text-[9px] text-gray-400 font-bold uppercase mb-0.5 tracking-widest">SỐ DƯ</span>
                <span id="balanceDisplay" class="text-white font-mono text-sm font-bold tracking-tight animate-pulse">...</span>
            </div>
            <div class="w-7 h-7 bg-gradient-to-br from-[#FCD535] to-[#d97706] rounded-full flex items-center justify-center text-[13px] font-black text-black shadow-[0_0_10px_rgba(252,213,53,0.4)] border border-[#fff]/30">T</div>
        </a>
    </header>

    <main class="flex-1 overflow-y-auto hide-scroll pb-10 pt-5 px-4 relative z-10">
        <div class="absolute top-0 left-0 right-0 h-48 bg-gradient-to-b from-emerald-500/10 to-transparent pointer-events-none z-0"></div>
        <div class="relative z-10">
            <div class="grid grid-cols-4 md:grid-cols-6 lg:grid-cols-8 gap-2.5">
                
                <!-- Baccarat -->
                <a href="bcr.html" class="bg-gradient-to-b from-white/[0.08] to-white/[0.02] rounded-[14px] p-1.5 border border-white/10 flex flex-col gap-1.5 shadow-lg backdrop-blur-sm active:scale-95 transition-transform hover:bg-white/[0.05]">
                    <div class="w-full aspect-square rounded-[10px] bg-gradient-to-br from-emerald-900 via-green-950 to-black relative overflow-hidden shadow-[inset_0_0_10px_rgba(0,0,0,0.8)] border border-emerald-500/20 flex items-center justify-center group">
                        <div class="absolute top-1 left-1 bg-emerald-500/20 backdrop-blur-md text-emerald-300 text-[7px] px-1 py-0.5 rounded border border-emerald-500/30 z-10 font-bold tracking-wider shadow-sm uppercase">Live</div>
                        <div class="flex gap-0.5 items-center group-hover:scale-110 transition-transform duration-500">
                            <i class="fa-solid fa-diamond text-red-500 text-2xl rotate-[-15deg]"></i>
                            <i class="fa-solid fa-spade text-black text-3xl rotate-[15deg] drop-shadow-[0_1px_1px_rgba(255,255,255,0.2)]"></i>
                        </div>
                    </div>
                    <div class="px-0.5 pb-1 flex flex-col items-center">
                        <h4 class="text-white font-black text-[10px] truncate w-full text-center tracking-tight">Baccarat</h4>
                        <p class="text-emerald-400 text-[8px] uppercase font-bold tracking-widest mt-[2px]">Hot</p>
                    </div>
                </a>

                <!-- Tài Xỉu -->
                <a href="javascript:void(0)" onclick="window.showMaintenanceToast('Tài Xỉu')" class="bg-gradient-to-b from-white/[0.08] to-white/[0.02] rounded-[14px] p-1.5 border border-white/10 flex flex-col gap-1.5 shadow-lg backdrop-blur-sm active:scale-95 transition-transform hover:bg-white/[0.05]">
                    <div class="w-full aspect-square rounded-[10px] bg-gradient-to-br from-indigo-950 to-black relative overflow-hidden shadow-[inset_0_0_10px_rgba(0,0,0,0.8)] border border-indigo-500/20 flex items-center justify-center group">
                        <div class="absolute top-1 left-1 bg-indigo-500/20 backdrop-blur-md text-indigo-300 text-[7px] px-1 py-0.5 rounded border border-indigo-500/30 z-10 font-bold tracking-wider shadow-sm uppercase">Mini</div>
                        <i class="fa-solid fa-dice text-white/20 text-4xl drop-shadow-lg group-hover:rotate-12 transition-transform duration-500"></i>
                    </div>
                    <div class="px-0.5 pb-1 flex flex-col items-center">
                        <h4 class="text-white font-black text-[10px] truncate w-full text-center tracking-tight">Tài Xỉu</h4>
                        <p class="text-emerald-400 text-[8px] uppercase font-bold tracking-widest mt-[2px]">Mini</p>
                    </div>
                </a>

                <!-- Xóc Đĩa -->
                <a href="javascript:void(0)" onclick="window.showMaintenanceToast('Xóc Đĩa')" class="bg-gradient-to-b from-white/[0.08] to-white/[0.02] rounded-[14px] p-1.5 border border-white/10 flex flex-col gap-1.5 shadow-lg backdrop-blur-sm active:scale-95 transition-transform hover:bg-white/[0.05]">
                    <div class="w-full aspect-square rounded-[10px] bg-gradient-to-br from-rose-950 to-black relative overflow-hidden shadow-[inset_0_0_10px_rgba(0,0,0,0.8)] border border-rose-500/20 flex items-center justify-center group">
                        <i class="fa-solid fa-compact-disc text-white/5 text-5xl group-hover:rotate-180 transition-transform duration-1000"></i>
                        <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 flex gap-1">
                            <div class="w-2 h-2 rounded-full bg-white shadow-md"></div>
                            <div class="w-2 h-2 rounded-full bg-red-600 shadow-md border border-white/20"></div>
                        </div>
                    </div>
                    <div class="px-0.5 pb-1 flex flex-col items-center">
                        <h4 class="text-white font-black text-[10px] truncate w-full text-center tracking-tight">Xóc Đĩa</h4>
                        <p class="text-emerald-400 text-[8px] uppercase font-bold tracking-widest mt-[2px]">Hot</p>
                    </div>
                </a>

                <!-- Roulette -->
                <a href="javascript:void(0)" onclick="window.showMaintenanceToast('Roulette')" class="bg-gradient-to-b from-white/[0.08] to-white/[0.02] rounded-[14px] p-1.5 border border-white/10 flex flex-col gap-1.5 shadow-lg backdrop-blur-sm active:scale-95 transition-transform hover:bg-white/[0.05]">
                    <div class="w-full aspect-square rounded-[10px] bg-gradient-to-br from-purple-950 to-black relative overflow-hidden shadow-[inset_0_0_10px_rgba(0,0,0,0.8)] border border-purple-500/20 flex items-center justify-center group">
                        <i class="fa-solid fa-circle-notch text-white/10 text-4xl group-hover:rotate-180 transition-transform duration-1000"></i>
                        <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-3 h-3 bg-red-500 rounded-full border border-white/20 shadow-md"></div>
                    </div>
                    <div class="px-0.5 pb-1 flex flex-col items-center">
                        <h4 class="text-white font-black text-[10px] truncate w-full text-center tracking-tight">Roulette</h4>
                        <p class="text-emerald-400 text-[8px] uppercase font-bold tracking-widest mt-[2px]">Live</p>
                    </div>
                </a>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
        document.addEventListener('dblclick', function(e) { e.preventDefault(); });

        const app = initializeApp({
            apiKey: "AIzaSyAyYO8ZhxVvOImOZveUJULkK8tdcSxo7pU",
            authDomain: "btccoinbig.firebaseapp.com",
            projectId: "btccoinbig",
            storageBucket: "btccoinbig.firebasestorage.app",
            messagingSenderId: "116892525933",
            appId: "1:116892525933:web:04b0da25f3f933ce162664"
        });
        const db = getFirestore(app); const auth = getAuth(app);
        const balanceDisplay = document.getElementById('balanceDisplay');

        function updateBalanceUI(b) { balanceDisplay.innerText = b.toLocaleString('en-US', {minimumFractionDigits:2}); balanceDisplay.classList.remove('animate-pulse'); }
        onAuthStateChanged(auth, (user) => {
            if (user) {
                if (!user.isAnonymous) { onSnapshot(doc(db, "users", user.uid), (s) => { updateBalanceUI(s.exists() ? s.data().balance || 0 : 0); }); } 
                else { let u = localStorage.getItem('crownex_user_info'); updateBalanceUI(u ? JSON.parse(u).balance || 1000 : 1000); }
            } else { signInAnonymously(auth); updateBalanceUI(0); }
        });

        let toastTimeout;
        window.showMaintenanceToast = function() {
            const t = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = `Tựa game đang bảo trì, vui lòng quay lại sau!`;
            t.classList.add('show');
            if(toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => { t.classList.remove('show'); }, 3000);
        }
    </script>
</body>
</html>
